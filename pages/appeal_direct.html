window.clearCacheNow = async function() {
    var results = [];var preserve = {};
    ['logged_in','ss_theme'].forEach(function(k) { var v = localStorage.getItem(k); if(v) preserve[k]=v; });
    var lsCount = localStorage.length;localStorage.clear();
    Object.keys(preserve).forEach(function(k) { localStorage.setItem(k, preserve[k]); });
    results.push('localStorage清除'+(lsCount-Object.keys(preserve).length)+'项');
    if ('caches' in window) {
        try { var ns = await caches.keys(); for(var i=0;i<ns.length;i++) await caches.delete(ns[i]); results.push('Cache清除'+ns.length+'个'); } catch(e){}
    }
    showToast('缓存清除完成！'+results.join(' | '),'warning',3000);
};

function createConfirmModal(title, content, onConfirm) {
    var old = document.getElementById('__globalModal');if (old) old.remove();
    var overlay = document.createElement('div');
    overlay.id = '__globalModal';overlay.className = 'modal-overlay show';
    var modal = document.createElement('div');
    modal.className = 'modal';modal.style.width = '420px';
    var header = document.createElement('div');
    header.className = 'modal-header';
    var titleSpan = document.createElement('span');
    titleSpan.className = 'modal-title';titleSpan.textContent = title;
    var closeBtn = document.createElement('div');
    closeBtn.className = 'modal-close';closeBtn.textContent = '×';
    closeBtn.onclick = function(){overlay.remove();};
    header.appendChild(titleSpan);header.appendChild(closeBtn);
    var body = document.createElement('div');
    body.className = 'modal-body';body.style.padding = '20px 24px';body.style.fontSize = '14px';body.style.lineHeight = '1.7';
    body.innerHTML = content;
    var footer = document.createElement('div');
    footer.className = 'modal-footer';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-default';cancelBtn.textContent = '取消';
    cancelBtn.onclick = function(){overlay.remove();};
    var confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn btn-primary';confirmBtn.id = '__confirmBtn';confirmBtn.textContent = '确认';
    confirmBtn.onclick = function(){overlay.remove();if(onConfirm)onConfirm();};
    footer.appendChild(cancelBtn);footer.appendChild(confirmBtn);
    modal.appendChild(header);modal.appendChild(body);modal.appendChild(footer);
    overlay.appendChild(modal);
    overlay.onclick = function(e){if(e.target===overlay)overlay.remove();};
    document.body.appendChild(overlay);
}

// 筛选后的索引数组（初始为全部）
var filteredAppeals = Array.from({length: appeals.length}, function(_, i) { return i; });

function initFilters(){
    var sel=document.getElementById('fType');var seen={};
    appeals.forEach(function(b){if(!seen[b.type]){seen[b.type]=1;var opt=document.createElement('option');opt.textContent=b.type;sel.appendChild(opt);}});
}

function statusTag(s){
    if(s==='已处理') return '<span class="tag-resolved">已处理</span>';
    if(s==='处理中') return '<span class="tag-processing">处理中</span>';
    return '<span class="tag-pending">待处理</span>';
}
function dash(v){return v||'<span style="color:var(--text-tertiary)">--</span>';}

function imgThumbs(imgs,i){
    if(!imgs||imgs.length===0) return '<span style="color:var(--text-tertiary);font-size:11px">无</span>';
    var html='<div class="img-thumbs">';
    html+='<img class="img-thumb" src="'+imgs[0]+'" onclick="openPreview('+i+',0)" title="点击查看大图">';
    if(imgs.length>1) html+='<div class="img-more" onclick="openPreview('+i+',1)">+'+imgs.length+'</div>';
    html+='</div>';
    return html;
}

function renderTable(){
    var tbody=document.getElementById('appealTbody');
    var frag=document.createDocumentFragment();
    filteredAppeals.forEach(function(idx){
        var b=appeals[idx];
        var tr=document.createElement('tr');

        // 复选框
        var td0=document.createElement('td');
        td0.style.textAlign='center';
        var cb=document.createElement('input');
        cb.type='checkbox';cb.className='row-cb';cb.style.cursor='pointer';cb.setAttribute('data-idx',idx);
        td0.appendChild(cb);tr.appendChild(td0);

        // 单号
        var td1=document.createElement('td');
        var span=document.createElement('span');
        span.style.fontFamily='monospace';span.style.fontSize='12px';span.textContent=b.ref;
        td1.appendChild(span);tr.appendChild(td1);

        // 诉求名称/类型/提交人/提交时间
        ['name','type','submitter','submitTime'].forEach(function(k){
            var td=document.createElement('td');td.textContent=b[k];tr.appendChild(td);
        });

        // 处理时间
        var tdH=document.createElement('td');tdH.innerHTML=dash(b.handleTime);tr.appendChild(tdH);

        // 处理人
        var tdP=document.createElement('td');tdP.innerHTML=dash(b.handler);tr.appendChild(tdP);

        // 状态
        var tdS=document.createElement('td');
        tdS.innerHTML=statusTag(b.status);tr.appendChild(tdS);

        // 图片
        var tdI=document.createElement('td');tdI.innerHTML=imgThumbs(b.imgs,idx);tr.appendChild(tdI);

        // 操作按钮
        var tdA=document.createElement('td');
        var btn1=document.createElement('button');btn1.className='btn btn-default';btn1.style.cssText='padding:3px 8px;font-size:11px';btn1.textContent='详情';
        btn1.onclick=function(){showDetail(idx);};tdA.appendChild(btn1);
        if(b.status!=='已处理'){
            tdA.appendChild(document.createTextNode(' '));
            var btn2=document.createElement('button');btn2.className='btn btn-warning';btn2.style.cssText='padding:3px 8px;font-size:11px';btn2.textContent='取消';
            btn2.onclick=function(){cancelAppeal(idx);};tdA.appendChild(btn2);
        }
        tr.appendChild(tdA);
        frag.appendChild(tr);
    });
    tbody.innerHTML='';
    tbody.appendChild(frag);
    if(typeof initPaginations==='function') initPaginations();
}

var previewIdx=-1,previewImgIdx=0;
function openPreview(i,j){previewIdx=i;previewImgIdx=j||0;showPreviewImage();document.getElementById('imgPreview').classList.add('show');}
function closePreview(){document.getElementById('imgPreview').classList.remove('show');}
function showPreviewImage(){
    var imgs=appeals[previewIdx].imgs;
    if(imgs.length===0)return;
    document.getElementById('previewImg').src=imgs[previewImgIdx];
    document.getElementById('imgCounter').textContent=(previewImgIdx+1)+' / '+imgs.length;
}
function prevImage(e){e.stopPropagation();var imgs=appeals[previewIdx].imgs;previewImgIdx=(previewImgIdx-1+imgs.length)%imgs.length;showPreviewImage();}
function nextImage(e){e.stopPropagation();var imgs=appeals[previewIdx].imgs;previewImgIdx=(previewImgIdx+1)%imgs.length;showPreviewImage();}

function showDetail(i){var b=appeals[i];showToast(b.ref+' 详情<br>诉求：'+b.name+'<br>类型：'+b.type+'<br>提交人：'+b.submitter+'<br>提交时间：'+b.submitTime+'<br>处理人：'+(b.handler||'未分配')+'<br>状态：'+b.status,'info');}
function cancelAppeal(i){var b=appeals[i];createConfirmModal('取消诉求','确定要取消 <b>'+b.name+'</b> 吗？',function(){b.status='已处理';b.handleTime=new Date().toISOString().slice(0,16).replace('T',' ');renderTable();showToast(b.ref+' 已取消','warning');});}

function filterTable(){
    var fRef=(document.getElementById('fRef').value||'').trim().toLowerCase();
    var fType=document.getElementById('fType').value.replace(/[　]/g,'').trim();
    var fS=(document.getElementById('fSubmitter').value||'').trim().toLowerCase();
    var fDate=document.getElementById('fDate').value;
    var fStatus=document.getElementById('fStatus').value.replace(/[　]/g,'').trim();
    // 直接构建 filteredAppeals
    filteredAppeals = [];
    for(var i=0;i<appeals.length;i++){
        var b=appeals[i];
        var t=[b.ref,b.name,b.type,b.submitter,b.submitTime,(b.handleTime||''),(b.handler||''),b.status].join(' ').toLowerCase();
        if((!fRef||t.indexOf(fRef)>-1)&&(!fType||t.indexOf(fType)>-1)&&(!fS||t.indexOf(fS)>-1)&&(!fDate||t.indexOf(fDate)>-1)&&(!fStatus||t.indexOf(fStatus)>-1)){
            filteredAppeals.push(i);
        }
    }
    renderTable();
}
function resetFilters(){
    ['fRef','fType','fSubmitter','fDate','fStatus'].forEach(function(id){document.getElementById(id).value='';});
    filteredAppeals = Array.from({length: appeals.length}, function(_, i) { return i; });
    renderTable();
    showToast('筛选条件已重置','info');
}

document.addEventListener('DOMContentLoaded',function(){
    initFilters();
    document.querySelectorAll('.filter-row select option').forEach(function(opt){
        var t=opt.textContent.trim();if(t) opt.textContent='　　'+t+'　　';
    });
    var searchBtn=document.querySelector('.btn-search');
    if(searchBtn) searchBtn.addEventListener('click',filterTable);
});

function showToast(msg,type,duration){
    duration = duration || 3000;
    var container=document.getElementById('toastContainer');var t=document.createElement('div');
    t.style.cssText='padding:10px 20px;border-radius:6px;margin-bottom:8px;background:linear-gradient(135deg,rgba(16,24,56,0.95),rgba(22,41,105,0.95));border:1px solid rgba(43,104,224,0.4);color:#a0cfff;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn 0.3s ease';
    t.innerHTML='<i class="fa fa-'+(type==='success'?'check-circle':type==='warning'?'exclamation-triangle':'info-circle')+'"></i> '+msg;
    container.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove()},300)},duration);
}

var initPaginations=(function(){
    var PAGE_SIZE=10;
    return function initPaginations(){
        document.querySelectorAll('.card').forEach(function(card){
            var table=card.querySelector('.data-table tbody');
            var pagination=card.querySelector('.pagination');
            if(!table||!pagination)return;
            var rows=Array.from(table.querySelectorAll('tr'));
            if(rows.length===0)return;
            var infoSpan=pagination.querySelector('span:first-child');
            var totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
            function renderPage(page){
                var start=(page-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,rows.length);
                rows.forEach(function(r,i){r.style.display=(i>=start&&i<end)?'':'none';});
                infoSpan.textContent='共 '+rows.length+' 条  第'+(start+1)+'-'+end+'条';
                updateBtns(page,totalPages,pagination);
            }
            function updateBtns(page,total,pagi){
                var bd=pagi.querySelector('.page-btns');if(!bd)return;bd.innerHTML='';
                var prev=document.createElement('div');prev.className='page-btn'+(page<=1?' disabled':'');prev.textContent='«';prev.style.cssText='cursor:'+(page<=1?'default':'pointer')+';opacity:'+(page<=1?'0.4':'1');
                if(page>1)prev.onclick=function(){renderPage(page-1);};bd.appendChild(prev);
                var sp=Math.max(1,page-2),ep=Math.min(total,sp+4);if(ep-sp<4)sp=Math.max(1,ep-4);
                for(var p=sp;p<=ep;p++){(function(pp){var btn=document.createElement('div');btn.className='page-btn'+(pp===page?' active':'');btn.textContent=pp;btn.onclick=function(){renderPage(pp);};bd.appendChild(btn);})(p);}
                var next=document.createElement('div');next.className='page-btn'+(page>=total?' disabled':'');next.textContent='»';next.style.cssText='cursor:'+(page>=total?'default':'pointer')+';opacity:'+(page>=total?'0.4':'1');
                if(page<total)next.onclick=function(){renderPage(page+1);};bd.appendChild(next);
            }
            renderPage(1);
        });
    };
})();

// ========== 导出功能 ==========
var exportFormat='excel';
function openExportModal(){document.getElementById('exportModal').classList.add('show');}
function closeExportModal(){document.getElementById('exportModal').classList.remove('show');}
function selectExportFormat(el,fmt){
    exportFormat=fmt;
    document.querySelectorAll('.export-option').forEach(function(o){o.classList.remove('selected');});
    el.classList.add('selected');
}
function doExport(){
    var data=appeals.map(function(b){return{
        '单号':b.ref,'诉求名称':b.name,'诉求类型':b.type,'提交人':b.submitter,
        '提交时间':b.submitTime,'处理时间':b.handleTime||'--','处理人':b.handler||'--','处理状态':b.status,
        '现场图片':b.imgs&&b.imgs.length>0?b.imgs.join(', '):'无'
    };});
    try{
        if(exportFormat==='excel'){
            var ws=XLSX.utils.json_to_sheet(data);
            var wb=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb,ws,'诉求数据');
            XLSX.writeFile(wb,'诉求数据_'+new Date().toISOString().slice(0,10)+'.xlsx');
        }else if(exportFormat==='pdf'){
            // 用浏览器打印生成PDF，完美支持中文
            var w=window.open('','_blank');
            w.document.write('<html><head><meta charset="utf-8"><title>诉求数据</title>');
            w.document.write('<style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ccc;padding:7px}th{background:#40c4ff;color:#fff;position:sticky;top:0}</style>');
            w.document.write('</head><body>');
            w.document.write('<h2>诉求数据</h2>');
            w.document.write('<table><thead><tr><th>单号</th><th>诉求名称</th><th>诉求类型</th><th>提交人</th><th>提交时间</th><th>处理时间</th><th>处理人</th><th>处理状态</th></tr></thead><tbody>');
            data.forEach(function(r){w.document.write('<tr>'+['单号','诉求名称','诉求类型','提交人','提交时间','处理时间','处理人','处理状态'].map(function(k){return '<td>'+r[k]+'</td>'}).join('')+'</tr>');});
            w.document.write('</tbody></table></body></html>');
            w.document.close();
            setTimeout(function(){w.print();setTimeout(function(){w.close();},500);},300);
        }else if(exportFormat==='word'){
            var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>诉求数据</title></head><body>';
            html+='<h2>诉求数据</h2><table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:12px;width:100%">';
            html+='<tr style="background:#40c4ff;color:#fff"><th>单号</th><th>诉求名称</th><th>诉求类型</th><th>提交人</th><th>提交时间</th><th>处理时间</th><th>处理人</th><th>处理状态</th></tr>';
            data.forEach(function(r){html+='<tr><td>'+r['单号']+'</td><td>'+r['诉求名称']+'</td><td>'+r['诉求类型']+'</td><td>'+r['提交人']+'</td><td>'+r['提交时间']+'</td><td>'+r['处理时间']+'</td><td>'+r['处理人']+'</td><td>'+r['处理状态']+'</td></tr>';});
            html+='</table></body></html>';
            var blob=new Blob(['﻿'+html],{type:'application/msword'});
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a');a.href=url;a.download='诉求数据_'+new Date().toISOString().slice(0,10)+'.doc';
            document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
        }
        showToast('导出成功！格式：'+exportFormat,'success');
    }catch(e){showToast('导出失败：'+e.message,'warning');}
    closeExportModal();
}

function openAddModal(){
    document.getElementById('addName').value='';
    document.getElementById('addType').value='';
    document.getElementById('addSubmitter').value='';
    document.getElementById('addSubmitTime').value=new Date().toISOString().slice(0,16);
    document.getElementById('addStatus').value='';
    document.getElementById('addHandler').value='';
    document.getElementById('addHandleTime').value='';
    document.getElementById('addImgs').value='';
    document.getElementById('addModal').classList.add('show');
}
function closeAddModal(){document.getElementById('addModal').classList.remove('show');}
function doAdd(){
    var name=document.getElementById('addName').value.trim();
    var type=document.getElementById('addType').value;
    var submitter=document.getElementById('addSubmitter').value.trim();
    var submitTime=document.getElementById('addSubmitTime').value;
    var status=document.getElementById('addStatus').value;
    var handler=document.getElementById('addHandler').value.trim();
    var handleTime=document.getElementById('addHandleTime').value;
    var imgsStr=document.getElementById('addImgs').value.trim();
    if(!name){showToast('请输入诉求名称','warning');return;}
    if(!type){showToast('请选择诉求类型','warning');return;}
    if(!submitter){showToast('请输入提交人','warning');return;}
    if(!submitTime){showToast('请选择提交时间','warning');return;}
    if(!status){showToast('请选择处理状态','warning');return;}
    var ref='AP'+new Date().toISOString().slice(0,10).replace(/-/g,'')+String(appeals.length+1).padStart(3,'0');
    var imgArr=imgsStr?imgsStr.split(',').map(function(s){return s.trim();}).filter(Boolean):[];
    appeals.unshift({ref:ref,name:name,type:type,submitter:submitter,submitTime:submitTime.replace('T',' '),handleTime:handleTime?handleTime.replace('T',' '):null,handler:handler||null,status:status,imgs:imgArr});
    renderTable();
    closeAddModal();
    showToast('新增成功！单号：'+ref,'success');
}
