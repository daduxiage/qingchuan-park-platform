<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高德地图加载测试</title>
<style>
body{margin:0;padding:20px;font-family:sans-serif;}
#status{padding:10px;margin-bottom:10px;background:#f0f0f0;border-radius:6px;}
#amap{width:100%;height:400px;}
</style>
<script type="text/javascript">
window._AMapSecurityConfig = {
  securityJsCode: '8cc1e17e87bd8d7f80d303d6e7bdbc0a',
};
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7d2674ce8375986e20c048ead06989d0"></script>
</head>
<body>
<h2>高德地图API加载测试</h2>
<div id="status">正在加载高德地图API...</div>
<div id="amap"></div>
<script>
console.log('[Test] 脚本开始执行');
console.log('[Test] typeof AMap:', typeof AMap);

var checkCount = 0;
function checkAMap(){
  checkCount++;
  var statusEl = document.getElementById('status');
  if(typeof AMap !== 'undefined'){
    statusEl.innerHTML = '✅ AMap已加载（检查' + checkCount + '次）';
    statusEl.style.background = '#d4edda';
    console.log('[Test] AMap加载成功，开始初始化地图...');
    initMap();
  } else if(checkCount < 50){
    statusEl.innerHTML = '⏳ 等待AMap加载...（' + checkCount + '/50）';
    setTimeout(checkAMap, 200);
  } else {
    statusEl.innerHTML = '❌ AMap加载超时！请检查API Key或网络';
    statusEl.style.background = '#f8d7da';
    console.error('[Test] AMap加载超时');
  }
}

function initMap(){
  try {
    var map = new AMap.Map('amap',{
      zoom:12,
      center:[105.23, 32.33],
      viewMode:'3D'
    });
    console.log('[Test] 地图初始化成功！');
    document.getElementById('status').innerHTML = '✅ 地图初始化成功！';
  } catch(e){
    console.error('[Test] 地图初始化失败：', e);
    document.getElementById('status').innerHTML = '❌ 地图初始化失败：' + e.message;
  }
}

// 开始检测
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', function(){ checkAMap(); });
} else {
  checkAMap();
}
</script>
</body>
</html>
