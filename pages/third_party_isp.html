<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>运营商接入 · 青川庄子上智慧工业园</title>
    <script>if(localStorage.getItem('ss_theme')!=='dark'){document.documentElement.classList.add('light-theme')}</script>
    <link rel="stylesheet" href="/pages/common.css?v=20260315"/>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="/pages/echarts.min.js"></script>
    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="/pages/tracker.js?v=20260515"></script>
    <style>
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.status-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;transition:all .3s}
.status-card .sc-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.status-card .sc-body{flex:1;min-width:0}
.status-card .sc-value{font-size:22px;font-weight:700;line-height:1.2}
.status-card .sc-label{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.tag-active{background:rgba(76,217,100,0.12);color:#4cd964;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.tag-warning{background:rgba(255,149,0,0.12);color:#ff9500;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.tag-error{background:rgba(255,77,79,0.12);color:#ff4d4f;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.filter-row .form-control{min-width:120px;width:auto;flex:0 0 auto}
.data-table td{white-space:nowrap}
.export-options{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.export-option{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--split-color);border-radius:8px;cursor:pointer;transition:all .2s;background:transparent}
.export-option:hover{border-color:#40c4ff;background:rgba(64,196,255,0.06)}
.export-option.selected{border-color:#40c4ff;background:rgba(64,196,255,0.1)}
.export-option-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.export-option-icon.excel{background:rgba(76,175,80,0.15);color:#4caf50}
.export-option-icon.pdf{background:rgba(244,67,54,0.15);color:#f44336}
.export-option-icon.word{background:rgba(33,150,243,0.15);color:#2196f3}
.export-option-body{flex:1}
.export-option-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.export-option-desc{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.export-option-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--split-color);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.export-option.selected .export-option-check{border-color:#40c4ff;background:#40c4ff}
.export-option.selected .export-option-check::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
@media(max-width:900px){.status-grid{grid-template-columns:repeat(2,1fr)}.chart-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="loading-mask" id="loadingMask"><div class="loading-spinner"></div><div class="loading-text">运营商接入 · 加载中...</div></div>
<div class="page-header"><div class="page-header-left"><a href="../index.html" class="back-btn"><i class="fa fa-home"></i></a><div class="page-breadcrumb">青川县庄子上工业园区智慧园区平台 / <span>三方接入 / 运营商</span></div></div><div class="page-header-right"></div></div>
<div class="page-body">
<div class="chart-row">
    <div class="chart-box"><div class="chart-box-title">运营商实时调用趋势</div><div id="chartTrend" class="chart-canvas" style="height:280px;"></div></div>
    <div class="chart-box"><div class="chart-box-title">运营商请求速率 (RPS)</div><div id="chartRPS" class="chart-canvas" style="height:280px;"></div></div>
</div>
<div class="status-grid" id="statusGrid"></div>
<div class="card"><div class="card-header"><div class="card-title"><i class="fa fa-plug" style="color:#40c4ff"></i> 运营商接口列表</div>
<div class="card-toolbar"><div class="toolbar-actions">
    <button class="btn btn-default" onclick="resetFilters()">重置</button>
    <button class="btn btn-primary btn-search"><i class="fa fa-search"></i> 查询</button>
    <button class="btn btn-success" onclick="openExportModal()"><i class="fa fa-download"></i> 导出</button>
</div></div></div>
<div class="card-body">
    <div class="filter-row">
        <input class="form-control" placeholder="搜索接口..." id="fKeyword">
        <input class="form-control" type="date" id="fDate" title="接入时间">
    </div>
    <div class="table-wrap"><table class="data-table" id="apiTable"><thead><tr>
        <th style="width:110px">单号</th><th>接口名称</th><th>接口地址</th><th style="width:100px">接入时间</th>
        <th>认证方式</th><th style="width:75px">有效性</th><th style="width:170px">操作</th>
    </tr></thead><tbody id="apiTbody"></tbody></table></div>
    <div class="pagination"><span>共 0 条</span><div class="page-btns"></div></div>
</div></div>
</div>

<div class="modal-overlay" id="detailModal"><div class="modal" style="width:560px"><div class="modal-header"><span class="modal-title"><i class="fa fa-info-circle" style="color:#7b61ff;margin-right:6px"></i>接口详情</span><div class="modal-close" onclick="closeDetailModal()">×</div></div><div class="modal-body" id="detailBody" style="padding:20px 24px;font-size:14px;line-height:1.8"></div><div class="modal-footer"><button class="btn btn-default" onclick="closeDetailModal()">关闭</button></div></div></div>

<div class="modal-overlay" id="exportModal"><div class="modal" style="width:440px"><div class="modal-header"><span class="modal-title"><i class="fa fa-download" style="color:#40c4ff;margin-right:6px"></i>导出数据</span><div class="modal-close" onclick="closeExportModal()">×</div></div><div class="modal-body"><div class="export-options"><div class="export-option selected" onclick="selectExport(this,'excel')"><div class="export-option-icon excel"><i class="fa fa-file-excel"></i></div><div class="export-option-body"><div class="export-option-title">Excel</div><div class="export-option-desc">.xlsx</div></div><div class="export-option-check"></div></div><div class="export-option" onclick="selectExport(this,'pdf')"><div class="export-option-icon pdf"><i class="fa fa-file-pdf"></i></div><div class="export-option-body"><div class="export-option-title">PDF</div><div class="export-option-desc">.pdf</div></div><div class="export-option-check"></div></div><div class="export-option" onclick="selectExport(this,'word')"><div class="export-option-icon word"><i class="fa fa-file-word"></i></div><div class="export-option-body"><div class="export-option-title">Word</div><div class="export-option-desc">.doc</div></div><div class="export-option-check"></div></div></div></div><div class="modal-footer"><button class="btn btn-default" onclick="closeExportModal()">取消</button><button class="btn btn-primary" onclick="doExport()"><i class="fa fa-download"></i> 导出</button></div></div></div>

<script src="/pages/common.js"></script>
<script>
(function(){document.querySelector('#loadingMask').classList.add('hide');setTimeout(function(){document.querySelector('#loadingMask').style.display='none'},500);})();
var apis=[{"name": "基站信令数据接入", "url": "kafka://10.0.21.10:9092/isp_signal", "time": "2023-03-20", "auth": "SASL/isp_kafka", "health": "正常"}, {"name": "用户画像查询接口", "url": "http://10.0.21.20/api/isp/profile", "time": "2023-07-10", "auth": "Token/isp_token", "health": "正常"}, {"name": "短信网关接口", "url": "https://api.sms.chinamobile.com/send", "time": "2024-12-01", "auth": "AppKey/sms_app", "health": "正常"}],filtered=[],PAGE_SIZE=15,exportFormat='excel';
var _chart1=null,_chart2=null,_td=[],_rd=[],_timer=null;
function getCssVar(n){var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||'#a0cfff';}
function genSN(){return 'API'+new Date().getFullYear()+String(Math.floor(Math.random()*9000+1000));}
function healthTag(s){return s==='正常'?'<span class="tag-active">正常</span>':s==='告警'?'<span class="tag-warning">告警</span>':'<span class="tag-error">异常</span>';}

function initStatusCards(){
    var grid=document.getElementById('statusGrid');
    var cards=[
        {icon:'fa-exclamation-triangle',cls:'rgba(255,77,79,0.15)',color:'#ff4d4f',label:'服务异常',id:'scAlert',v:'0'},
        {icon:'fa-tachometer-alt',cls:'rgba(64,196,255,0.15)',color:'#40c4ff',label:'实时请求速率',id:'scRPS',v:'0 req/s'},
        {icon:'fa-clock',cls:'rgba(76,217,100,0.15)',color:'#4cd964',label:'实时响应时间',id:'scLatency',v:'0 ms'},
        {icon:'fa-chart-bar',cls:'rgba(123,97,255,0.15)',color:'#7b61ff',label:'累计调用',id:'scTotal',v:'0'},
        {icon:'fa-cloud-upload-alt',cls:'rgba(0,194,184,0.15)',color:'#00c2b8',label:'API传输总量',id:'scData',v:'0 MB'},
        {icon:'fa-bug',cls:'rgba(255,149,0,0.15)',color:'#ff9500',label:'错误数',id:'scError',v:'0'},
        {icon:'fa-stream',cls:'rgba(255,126,179,0.15)',color:'#ff7eb3',label:'实时消息队列',id:'scMQ',v:'0 msg/s'},
        {icon:'fa-layer-group',cls:'rgba(100,200,255,0.15)',color:'#64c8ff',label:'队列中',id:'scQueued',v:'0'},
    ];
    cards.forEach(function(c){var d=document.createElement('div');d.className='status-card';d.innerHTML='<div class="sc-icon" style="background:'+c.cls+';color:'+c.color+'"><i class="fa '+c.icon+'"></i></div><div class="sc-body"><div class="sc-value" style="color:'+c.color+'" id="'+c.id+'">'+c.v+'</div><div class="sc-label">'+c.label+'</div></div>';grid.appendChild(d);});
}
function updateCards(){
    setVal('scAlert',Math.random()>0.9?'1':'0');setVal('scRPS',Math.floor(Math.random()*400+200)+' req/s');
    setVal('scLatency',Math.floor(Math.random()*30+10)+' ms');setVal('scTotal',Math.floor(Math.random()*30000+50000).toLocaleString());
    setVal('scData',Math.floor(Math.random()*50+20)+' GB');setVal('scError',String(Math.floor(Math.random()*5)));
    setVal('scMQ',Math.floor(Math.random()*200+100)+' msg/s');setVal('scQueued',String(Math.floor(Math.random()*30+5)));
}
function setVal(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}

function initCharts(){
    if(typeof echarts==='undefined'){setTimeout(initCharts,300);return;}
    for(var i=0;i<30;i++){_td.push(Math.floor(Math.random()*300+200));_rd.push(Math.floor(Math.random()*200+150));}
    _chart1=echarts.init(document.getElementById('chartTrend'));_chart2=echarts.init(document.getElementById('chartRPS'));updateCharts();
}
function updateCharts(){
    var tc=getCssVar('--text-primary'),now=new Date(),times=[];
    for(var i=29;i>=0;i--){var t=new Date(now.getTime()-(now.getTime()%5000)-i*5000);times.push(String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0'));}
    _chart1.setOption({tooltip:{trigger:'axis'},legend:{bottom:0,textStyle:{color:'#a0cfff',fontSize:11}},xAxis:{type:'category',data:times,axisLabel:{color:tc,fontSize:9,rotate:30},axisLine:{lineStyle:{color:'#40c4ff'}}},yAxis:{axisLabel:{color:tc,fontSize:10},splitLine:{lineStyle:{color:'rgba(64,196,255,0.15)'}}},grid:{left:42,right:10,top:10,bottom:38},series:[{name:'调用量',type:'line',smooth:true,data:_td,lineStyle:{color:'#40c4ff',width:2},areaStyle:{color:'rgba(64,196,255,0.12)'},symbol:'none'}]});
    _chart2.setOption({tooltip:{trigger:'axis'},legend:{bottom:0,textStyle:{color:'#a0cfff',fontSize:11}},xAxis:{type:'category',data:times,axisLabel:{color:tc,fontSize:9,rotate:30},axisLine:{lineStyle:{color:'#4cd964'}}},yAxis:{axisLabel:{color:tc,fontSize:10},splitLine:{lineStyle:{color:'rgba(76,217,100,0.15)'}}},grid:{left:42,right:10,top:10,bottom:38},series:[{name:'RPS',type:'line',smooth:true,data:_rd,lineStyle:{color:'#4cd964',width:2},areaStyle:{color:'rgba(76,217,100,0.1)'},symbol:'none'}]});
}
function startRt(){_timer=setInterval(function(){_td.push(Math.floor(Math.random()*200+200));_rd.push(Math.floor(Math.random()*150+100));if(_td.length>30){_td.shift();_rd.shift();}updateCharts();updateCards();},5000);}

function renderTable(){
    var tbody=document.getElementById('apiTbody'),frag=document.createDocumentFragment();
    filtered.forEach(function(idx){
        var b=apis[idx],tr=document.createElement('tr');
        tr.innerHTML='<td>'+b.sn+'</td><td><b>'+b.name+'</b></td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:monospace">'+b.url+'</td><td>'+b.time+'</td><td style="font-size:12px">'+b.auth+'</td><td>'+healthTag(b.health)+'</td><td></td>';
        var tdA=tr.lastChild;
        addBtn(tdA,'详情',idx,function(i){showDetail(i);});
        addBtn(tdA,'编辑',idx,function(i){showDetail(i);});
        addBtn(tdA,'删除',idx,function(i){var n=apis[i].name;if(confirm('确定删除接口'+n+'吗？')){apis.splice(i,1);filtered=apis.map(function(_,i2){return i2;});renderTable();showToast('已删除','success');}},true);
        frag.appendChild(tr);
    });
    tbody.innerHTML='';tbody.appendChild(frag);if(typeof initPagination==='function')initPagination();
}
function addBtn(parent,text,idx,fn,isDanger){
    if(parent.children.length)parent.appendChild(document.createTextNode(' '));
    var btn=document.createElement('button');btn.className='btn btn-'+(isDanger?'danger':'default');btn.style.cssText='padding:3px 8px;font-size:11px';
    btn.textContent=text;btn.dataset.deleteInited='1';btn.setAttribute('onclick','('+fn.toString()+')('+idx+')');parent.appendChild(btn);
}
function showDetail(i){
    var b=apis[i];if(!b){showToast('数据加载失败','warning');return;}
    var body=document.getElementById('detailBody');
    body.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px"><div><b style="color:var(--text-secondary)">单号：</b>'+b.sn+'</div><div><b style="color:var(--text-secondary)">接口名称：</b>'+b.name+'</div><div><b style="color:var(--text-secondary)">有效性：</b>'+healthTag(b.health)+'</div><div><b style="color:var(--text-secondary)">接入时间：</b>'+b.time+'</div><div><b style="color:var(--text-secondary)">认证方式：</b>'+b.auth+'</div></div><div style="margin-top:14px"><b style="color:var(--text-secondary)">接口地址：</b></div><div style="margin-top:6px;padding:12px;background:rgba(64,196,255,0.06);border-radius:6px;line-height:1.7;font-size:12px;border-left:3px solid #40c4ff;font-family:monospace;word-break:break-all">'+b.url+'</div>';
    document.getElementById('detailModal').classList.add('show');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('show');}

function filterTable(){
    var kw=(document.getElementById('fKeyword').value||'').trim().toLowerCase(),fd=document.getElementById('fDate').value;
    filtered=[];apis.forEach(function(a,i){var t=(a.sn+' '+a.name+' '+a.url+' '+a.auth).toLowerCase();if((!kw||t.indexOf(kw)>-1)&&(!fd||a.time>=fd))filtered.push(i);});
    renderTable();
}
function resetFilters(){document.getElementById('fKeyword').value='';document.getElementById('fDate').value='';filtered=apis.map(function(_,i){return i;});renderTable();showToast('筛选已重置','info');}

var initPagination=(function(){return function(){
    document.querySelectorAll('.card').forEach(function(card){
        var table=card.querySelector('.data-table tbody'),pagi=card.querySelector('.pagination');if(!table||!pagi)return;
        var rows=Array.from(table.querySelectorAll('tr'));if(!rows.length)return;
        var info=pagi.querySelector('span:first-child'),tp=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
        function rp(p){var s=(p-1)*PAGE_SIZE,e=Math.min(s+PAGE_SIZE,rows.length);rows.forEach(function(r,i){r.style.display=(i>=s&&i<e)?'':'none';});info.textContent='共 '+rows.length+' 条  第'+(s+1)+'-'+e+'条';ub(p,tp,pagi);}
        function ub(p,t,pgi){var bd=pgi.querySelector('.page-btns');if(!bd)return;bd.innerHTML='';var prev=document.createElement('div');prev.className='page-btn'+(p<=1?' disabled':'');prev.textContent='«';if(p>1)prev.onclick=function(){rp(p-1);};bd.appendChild(prev);var sp=Math.max(1,p-2),ep=Math.min(t,sp+4);if(ep-sp<4)sp=Math.max(1,ep-4);for(var pp=sp;pp<=ep;pp++){(function(pp){var btn=document.createElement('div');btn.className='page-btn'+(pp===p?' active':'');btn.textContent=pp;btn.onclick=function(){rp(pp);};bd.appendChild(btn);})(pp);}var next=document.createElement('div');next.className='page-btn'+(p>=t?' disabled':'');next.textContent='»';if(p<t)next.onclick=function(){rp(p+1);};bd.appendChild(next);}
        rp(1);
    });
};})();

function openExportModal(){document.getElementById('exportModal').classList.add('show');}
function closeExportModal(){document.getElementById('exportModal').classList.remove('show');}
function selectExport(el,fmt){exportFormat=fmt;document.querySelectorAll('.export-option').forEach(function(o){o.classList.remove('selected');});el.classList.add('selected');}
function doExport(){
    var data=apis.map(function(b){return{单号:b.sn,接口名称:b.name,接口地址:b.url,接入时间:b.time,认证方式:b.auth,有效性:b.health};});
    var fn='运营商_'+new Date().toISOString().slice(0,10);
    try{
        if(exportFormat==='excel'){var ws=XLSX.utils.json_to_sheet(data);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'接口');XLSX.writeFile(wb,fn+'.xlsx');}
        else if(exportFormat==='pdf'){var w=window.open('','_blank');w.document.write('<html><head><meta charset="utf-8"><title>接口</title><style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px;font-size:11px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:5px}th{background:#40c4ff;color:#fff}</style></head><body><h2>运营商接口列表</h2><table><thead><tr><th>单号</th><th>名称</th><th>地址</th><th>有效性</th></tr></thead><tbody>');data.forEach(function(r){w.document.write('<tr><td>'+r['单号']+'</td><td>'+r['接口名称']+'</td><td>'+r['接口地址']+'</td><td>'+r['有效性']+'</td></tr>');});w.document.write('</tbody></table></body></html>');w.document.close();setTimeout(function(){w.print();setTimeout(function(){w.close();},500);},300);}
        else if(exportFormat==='word'){var html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body><h2>运营商接口列表</h2><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-size:11px;width:100%"><tr style="background:#40c4ff;color:#fff"><th>单号</th><th>名称</th><th>地址</th><th>有效性</th></tr>';data.forEach(function(r){html+='<tr><td>'+r['单号']+'</td><td>'+r['接口名称']+'</td><td>'+r['接口地址']+'</td><td>'+r['有效性']+'</td></tr>';});html+='</table></body></html>';var blob=new Blob(['﻿'+html],{type:'application/msword'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn+'.doc';document.body.appendChild(a);a.click();a.remove();}
        showToast('导出成功','success');
    }catch(e){showToast('导出失败:'+e.message,'warning');}
    closeExportModal();
}

window.addEventListener('DOMContentLoaded',function(){
    apis.forEach(function(a,i){a.sn='AP'+('ISP'+String(i+1).padStart(2,'0'));a.id=i;});filtered=apis.map(function(_,i){return i;});
    initStatusCards();updateCards();initCharts();startRt();
    document.querySelector('.btn-search').addEventListener('click',filterTable);renderTable();
});
window.addEventListener('pagehide',function(){if(_timer)clearInterval(_timer);if(_chart1){_chart1.dispose();_chart1=null;}if(_chart2){_chart2.dispose();_chart2=null;}});
</script>
</body>
</html>
