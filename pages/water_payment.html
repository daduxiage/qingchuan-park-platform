    <style>
.info-label{font-size:12px;color:var(--text-tertiary);margin-bottom:4px}

.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;border-radius:8px;cursor:pointer;transition:all .3s;border:1px solid transparent;text-align:center;gap:6px;min-width:0}

/* 浅色主题 */

@media(max-width:768px){.action-grid{grid-template-columns:repeat(2,1fr)}}

<div class="page-body">

<!-- 统计卡片 -->

                <div class="action-btn btn-branch" onclick="showToast('查看营业网点...','info')"><div class="act-icon"><i class="fa fa-store-alt"></i></div><div class="act-label">营业网点</div></div>

<!-- 第三行：水费账单 -->
<div class="card">

                </tr></thead>

<script src="/pages/common.js">
<script src="/pages/tracker.js"></script></script>
<script>
(function(){document.querySelector('#loadingMask').classList.add('hide');setTimeout(function(){document.querySelector('#loadingMask').style.display='none'},500);})();

window.clearCacheNow = async function() {
    var results = [];var preserve = {};
    ['logged_in','ss_theme'].forEach(function(k) { var v = localStorage.getItem(k); if(v) preserve[k]=v; });
    var lsCount = localStorage.length;localStorage.clear();
    Object.keys(preserve).forEach(function(k) { localStorage.setItem(k, preserve[k]); });
    results.push('localStorage清除'+(lsCount-Object.keys(preserve).length)+'项');
    if ('caches' in window) {
        try { var ns = await caches.keys(); for(var i=0;i<ns.length;i++) await caches.delete(ns[i]); results.push('Cache清除'+ns.length+'个'); } catch(e){}
    }
    showToast('缓存清除完成！'+results.join(' | '),'warning',3000);
};

function createConfirmModal(title, content, onConfirm) {
    var old = document.getElementById('__globalModal');if (old) old.remove();
    var overlay = document.createElement('div');overlay.id = '__globalModal';overlay.className = 'modal-overlay show';
    overlay.innerHTML = '<div class="modal" style="width:420px"><div class="modal-header"><span class="modal-title">'+title+'</span><div class="modal-close" onclick="document.getElementById(\'__globalModal\').remove()">×</div></div><div class="modal-body" style="padding:20px 24px;font-size:14px;line-height:1.7">'+content+'</div><div class="modal-footer"><button class="btn btn-default" onclick="document.getElementById(\'__globalModal\').remove()">取消</button><button class="btn btn-primary" id="__confirmBtn">确认</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('__confirmBtn').onclick = function() {document.getElementById('__globalModal').remove();if (onConfirm) onConfirm();};
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

// 2026年每月样本数据（1-5月已出账，6-12月待出账）
var INIT_BALANCE = 50000; // 初始预存余额

function calcStats(){
    var paidBills = billData.filter(function(b){return b.status==='paid'});
    var overdueBills = billData.filter(function(b){return b.status==='overdue'});
    var allBilled = billData.filter(function(b){return b.status!=='pending'});

    // KPI: 累计用水量
    var totalUsage = 0;
    allBilled.forEach(function(b){ totalUsage += (b.usage||0); });
    document.getElementById('kpiUsage').textContent = totalUsage.toLocaleString();
    document.getElementById('kpiTrend').textContent = '已出账 '+allBilled.length+' 个月';

    // KPI: 累计水费
    var totalAmount = 0;
    allBilled.forEach(function(b){ totalAmount += (b.amount||0); });
    var totalOwe = 0;
    overdueBills.forEach(function(b){ totalOwe += (b.amount||0); totalOwe += (b.penalty||0); });
    document.getElementById('kpiAmount').textContent = '¥'+totalAmount.toLocaleString();
    document.getElementById('kpiOwe').textContent = totalOwe > 0 ? '待缴纳 ¥'+totalOwe.toLocaleString() : '全部已缴清';

    // KPI: 已结清月份
    var paidMonths = paidBills.map(function(b){return b.month.slice(5)}).join('、');
    document.getElementById('kpiPaid').textContent = paidBills.length;
    document.getElementById('kpiPaidMonths').textContent = paidMonths ? paidMonths+'月已缴费' : '暂无';

    // KPI: 待缴
    var overdueMonth = overdueBills.map(function(b){return b.month.slice(5)}).join('、');
    if(overdueBills.length > 0){
        document.getElementById('kpiOverdue').textContent = '¥'+totalOwe.toLocaleString();
        document.getElementById('kpiOverdueLabel').textContent = overdueMonth+'月待缴';
        document.getElementById('kpiOverdueTip').textContent = '请在15日前缴纳';
    } else {
        document.getElementById('kpiOverdue').textContent = '¥0';
        document.getElementById('kpiOverdueLabel').textContent = '待缴水费';
        document.getElementById('kpiOverdueTip').textContent = '全部已缴清 ✓';
    }

    // 用户信息: 账户余额
    var totalPaidAmount = 0;
    paidBills.forEach(function(b){ totalPaidAmount += (b.amount||0); });
    var balance = INIT_BALANCE - totalPaidAmount;
    document.getElementById('infoBalance').textContent = '¥'+balance.toLocaleString(undefined,{minimumFractionDigits:2});
    document.getElementById('infoArrears').textContent = totalOwe > 0 ? '¥'+totalOwe.toLocaleString(undefined,{minimumFractionDigits:2}) : '¥0.00';
    if(balance < 0) document.getElementById('infoBalance').className = 'info-value val-highlight val-danger';
}

var billData=[
    {month:'2026-01',usage:4950,amount:16830,status:'paid',penalty:0,invoice:'已开'},
    {month:'2026-02',usage:4320,amount:14688,status:'paid',penalty:0,invoice:'已开'},
    {month:'2026-03',usage:5180,amount:17612,status:'paid',penalty:0,invoice:'已开'},
    {month:'2026-04',usage:4850,amount:16490,status:'paid',penalty:0,invoice:'已开'},
    {month:'2026-05',usage:4620,amount:15708,status:'overdue',penalty:96.50,invoice:'未开'},
    {month:'2026-06',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-07',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-08',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-09',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-10',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-11',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'},
    {month:'2026-12',usage:null,amount:null,status:'pending',penalty:0,invoice:'未开'}
];

function getStatusTag(s){
    if(s==='paid') return '<span class="status-paid">已结清</span>';
    if(s==='overdue') return '<span class="status-overdue">欠费</span>';
    return '<span style="color:var(--text-tertiary)">待出账</span>';
}
function getInvTag(i){return i==='已开'?'<span class="tag-invoiced">已开</span>':'<span class="tag-uninvoiced">未开</span>';}

function renderBills(){
    calcStats();
    var tbody=document.getElementById('billTbody');
    tbody.innerHTML=billData.map(function(b,i){
        var isPending = b.status==='pending';
        var usageCell = isPending ? '<span style="color:var(--text-tertiary)">--</span>' : '<span style="font-weight:600">'+b.usage.toLocaleString()+'</span>';
        var amountCell = isPending ? '<span style="color:var(--text-tertiary)">--</span>' : '<span style="color:#ff9500;font-weight:600">¥'+b.amount.toLocaleString()+'</span>';
        var penaltyCell = b.penalty > 0 ? '<span style="color:#ff4d4f;font-weight:600">¥'+b.penalty.toFixed(2)+'</span>' : '<span style="color:var(--text-tertiary)">--</span>';
        var actionCell = b.status==='overdue'
            ? '<button class="btn btn-warning" onclick="payBill('+i+')" style="padding:3px 10px;font-size:11px">去缴费</button>'
            : b.status==='paid'
            ? '<button class="btn btn-default" onclick="showDetail('+i+')" style="padding:3px 10px;font-size:11px">详情</button>'
            : '<span style="font-size:11px;color:var(--text-tertiary)">--</span>';
        return '<tr><td>'+b.month+'</td><td>'+usageCell+'</td><td>'+amountCell+'</td><td>'+getStatusTag(b.status)+'</td><td>'+penaltyCell+'</td><td>'+getInvTag(b.invoice)+'</td><td>'+actionCell+'</td></tr>';
    }).join('');
}
function payBill(i){var b=billData[i];showToast('跳转到缴费页面：'+b.month+' 水费 ¥'+(b.amount||'--'),'info')}
function showDetail(i){var b=billData[i];showToast(b.month+' 详情\n用水量：'+(b.usage||'--')+'m³\n金额：¥'+(b.amount||'--')+'\n状态：已结清\n开票：'+b.invoice,'success')}

function showToast(msg,type,duration){
    duration = duration || 3000;
    var container=document.getElementById('toastContainer');var t=document.createElement('div');
    t.style.cssText='padding:10px 20px;border-radius:6px;margin-bottom:8px;background:linear-gradient(135deg,rgba(16,24,56,0.95),rgba(22,41,105,0.95));border:1px solid rgba(43,104,224,0.4);color:#a0cfff;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn 0.3s ease';
    t.innerHTML='<i class="fa fa-'+(type==='success'?'check-circle':type==='warning'?'exclamation-triangle':'info-circle')+'"></i> '+msg;
    container.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove()},300)},duration);
}

setInterval(function(){var n=new Date();var p=function(x){return String(x).padStart(2,'0')};var el=document.getElementById('pageTime');if(el)el.textContent=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())},1000);

window.addEventListener('DOMContentLoaded',function(){renderBills()});

// ===== 通用分页 =====
(function() {
    var PAGE_SIZE = 10;
    function initPaginations() {
        document.querySelectorAll('.card').forEach(function(card) {
            var table = card.querySelector('.data-table tbody');
            var pagination = card.querySelector('.pagination');
            if (!table || !pagination) return;
            var rows = Array.from(table.querySelectorAll('tr'));
            if (rows.length === 0) return;
            var infoSpan = pagination.querySelector('span:first-child');
            var totalText = infoSpan ? infoSpan.textContent : '';
            var totalMatch = totalText.match(/\d[\d,]*/);
            var totalRecords = totalMatch ? parseInt(totalMatch[0].replace(/,/g,'')) : rows.length;
            var totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
            function renderPage(page) {
                var start = (page - 1) * PAGE_SIZE;
                var end = Math.min(start + PAGE_SIZE, rows.length);
                rows.forEach(function(row, i) { row.style.display = (i >= start && i < end) ? '' : 'none'; });
                if (infoSpan) {var ds = Math.min(start + 1, totalRecords);var de = Math.min(start + PAGE_SIZE, totalRecords);infoSpan.textContent = '共 ' + totalRecords.toLocaleString() + ' 条  第' + ds + '-' + de + '条';}
                updateBtns(page, totalPages, pagination);
            }
            function updateBtns(page, total, pagi) {
                var btnsDiv = pagi.querySelector('.page-btns'); if (!btnsDiv) return;btnsDiv.innerHTML = '';
                var prev = document.createElement('div'); prev.className = 'page-btn' + (page <= 1 ? ' disabled' : ''); prev.textContent = '«'; prev.style.cursor = page <= 1 ? 'default' : 'pointer'; prev.style.opacity = page <= 1 ? '0.4' : '1';
                if (page > 1) prev.onclick = function() { renderPage(page-1); };btnsDiv.appendChild(prev);
                var startP = Math.max(1, page-2); var endP = Math.min(total, startP+4); if (endP - startP < 4) startP = Math.max(1, endP-4);
                for (var p = startP; p <= endP; p++) {(function(pp) { var btn = document.createElement('div'); btn.className = 'page-btn' + (pp === page ? ' active' : ''); btn.textContent = pp; btn.onclick = function() { renderPage(pp); }; btnsDiv.appendChild(btn); })(p);}
                var next = document.createElement('div'); next.className = 'page-btn' + (page >= total ? ' disabled' : ''); next.textContent = '»'; next.style.cursor = page >= total ? 'default' : 'pointer'; next.style.opacity = page >= total ? '0.4' : '1';
                if (page < total) next.onclick = function() { renderPage(page+1); };btnsDiv.appendChild(next);
            }
            renderPage(1);
        });
    }
    window.addEventListener('DOMContentLoaded', function() { setTimeout(initPaginations, 200); });
})();
</script>
