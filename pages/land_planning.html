                updateStats();

                setTimeout(function() {
                    document.getElementById('loadingOverlay').style.display = 'none';
                }, 1200);
            });
        };

        function drawCenterMarker() {
            const marker = new AMap.Marker({
                position: PARK_CENTER,
                icon: new AMap.Icon({
                    size: new AMap.Size(40, 40),
                    image: 'data:image/svg+xml,' + encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">' +
                        '<circle cx="20" cy="20" r="18" fill="none" stroke="#40c4ff" stroke-width="2" opacity="0.5"/>' +
                        '<circle cx="20" cy="20" r="8" fill="rgba(64,196,255,0.3)" stroke="#40c4ff" stroke-width="1.5"/>' +
                        '<circle cx="20" cy="20" r="3" fill="#40c4ff"/>' +
                        '</svg>'
                    ),
                    imageSize: new AMap.Size(40, 40),
                }),
                offset: new AMap.Pixel(-20, -20),
                zIndex: 110,
                title: '青川县庄子上工业园区',
            });
            marker.setMap(map);
        }

        function drawAllLandPlots() {
            LAND_PLOTS.forEach(function(plot) {
                const polygon = new AMap.Polygon({
                    path: plot.path,
                    fillColor: plot.fillColor,
                    fillOpacity: 0.6,
                    strokeColor: plot.strokeColor,
                    strokeWeight: 2,
                    strokeStyle: 'solid',
                    strokeDasharray: [0, 0],
                    zIndex: 10,
                    cursor: 'pointer',
                });

                const glowPolygon = new AMap.Polygon({
                    path: plot.path,
                    fillColor: 'transparent',
                    fillOpacity: 0,
                    strokeColor: plot.strokeColor,
                    strokeWeight: 4,
                    strokeStyle: 'solid',
                    strokeOpacity: 0.2,
                    zIndex: 9,
                });

                polygon.setMap(map);
                glowPolygon.setMap(map);

                polygon.on('click', function(e) {
                    showPlotInfo(plot, e);
                });

                polygon.on('mouseover', function() {
                    polygon.setOptions({
                        fillOpacity: 0.85,
                        strokeWeight: 3,
                    });
                });

                polygon.on('mouseout', function() {
                    polygon.setOptions({
                        fillOpacity: 0.6,
                        strokeWeight: 2,
                    });
                    hidePlotInfo();
                });

                const labelCenter = getPolygonCenter(plot.path);
                const labelMarker = new AMap.Marker({
                    position: labelCenter,
                    content: '<div style="color:#fff;font-size:11px;font-weight:700;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,0.9);white-space:nowrap;pointer-events:none;line-height:1.2;">' + plot.id + '</div>',
                    offset: new AMap.Pixel(-15, -8),
                    zIndex: 50,
                });
                labelMarker.setMap(map);

                allPolygons.push({
                    polygon: polygon,
                    glow: glowPolygon,
                    label: labelMarker,
                    plot: plot
                });
            });
        }

        function getPolygonCenter(path) {
            let sumLng = 0, sumLat = 0;
            path.forEach(function(p) {
                sumLng += p[0];
                sumLat += p[1];
            });
            return [sumLng / path.length, sumLat / path.length];
        }

        function showPlotInfo(plot, e) {
            const popup = document.getElementById('infoPopup');
            popup.innerHTML = '<div class="popup-title">' + plot.id + ' ' + plot.name + '</div>' +
                '<div class="popup-detail">' +
                '用地类型：<span>' + getTypeName(plot.type) + '</span><br/>' +
                '规划面积：<span>' + plot.area.toFixed(1) + ' 亩</span><br/>' +
                '功能说明：<span>' + plot.desc + '</span>' +
                '</div>';
            popup.style.left = (e.pixel.x + 15) + 'px';
            popup.style.top = (e.pixel.y - 100) + 'px';
            popup.classList.add('show');
        }

        function hidePlotInfo() {
            document.getElementById('infoPopup').classList.remove('show');
        }

        function getTypeName(type) {
            const names = {
                'industrial': '工业用地',
                'commercial': '商业用地',
                'storage': '仓储用地'
            };
            return names[type] || type;
        }

        function filterByType(type) {
            const legendItems = document.querySelectorAll('.legend-item');

            if (activeFilter === type) {
                activeFilter = null;
                legendItems.forEach(function(item) { item.classList.remove('active'); });
                allPolygons.forEach(function(item) {
                    item.polygon.setMap(map);
                    item.glow.setMap(map);
                    item.label.setMap(map);
                });
            } else {
                activeFilter = type;
                legendItems.forEach(function(item) {
                    if (item.getAttribute('data-type') === type) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
                allPolygons.forEach(function(item) {
                    if (item.plot.type === type) {
                        item.polygon.setMap(map);
                        item.glow.setMap(map);
                        item.label.setMap(map);
                    } else {
                        item.polygon.setMap(null);
                        item.glow.setMap(null);
                        item.label.setMap(null);
                    }
                });
            }
        }

        function updateStats() {
            const totalPlots = LAND_PLOTS.length;
            const totalArea = LAND_PLOTS.reduce(function(sum, p) { return sum + p.area; }, 0);
            const industrialArea = LAND_PLOTS
                .filter(function(p) { return p.type === 'industrial'; })
                .reduce(function(sum, p) { return sum + p.area; }, 0);

            document.getElementById('statTotal').textContent = totalPlots;
            document.getElementById('statArea').textContent = totalArea.toFixed(0);
            document.getElementById('statBuilt').textContent = industrialArea.toFixed(0);
        }

        function toggleLayer() {
            const btn = document.getElementById('btnLayer');
            if (isSatellite) {
                satelliteLayer.setMap(null);
                map.setMapStyle('amap://styles/darkblue');
                btn.textContent = '🌐';
                btn.classList.add('active');
                isSatellite = false;
            } else {
                map.setMapStyle('');
                satelliteLayer.setMap(map);
                btn.textContent = '🛰️';
                btn.classList.remove('active');
                isSatellite = true;
            }
        }

        function toggleViewMode() {
            const btn = document.getElementById('btn3D');
            if (is3DMode) {
                map.setPitch(0);
                btn.textContent = '2D';
                btn.classList.add('active');
                is3DMode = false;
            } else {
                map.setPitch(55);
                btn.textContent = '3D';
                btn.classList.remove('active');
                is3DMode = true;
            }
        }

        function resetView() {
            map.setZoomAndCenter(16, PARK_CENTER);
            map.setPitch(55);
            is3DMode = true;
            document.getElementById('btn3D').textContent = '3D';
            document.getElementById('btn3D').classList.remove('active');
            if (activeFilter) {
                activeFilter = null;
                document.querySelectorAll('.legend-item').forEach(function(item) { item.classList.remove('active'); });
                allPolygons.forEach(function(item) {
                    item.polygon.setMap(map);
                    item.glow.setMap(map);
                    item.label.setMap(map);
                });
            }
        }

        function toggleLegend() {
            const panel = document.getElementById('legendPanel');
            const btn = document.getElementById('btnLegend');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
                btn.classList.remove('active');
            } else {
                panel.style.display = 'none';
                btn.classList.add('active');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') resetView();
            if (e.key === 'l' || e.key === 'L') toggleLegend();
        });

        window.addEventListener('resize', function() {
            if (map) map.resize();
        });

        function updateTime() {
            var now = new Date();
            document.getElementById('currentTime').textContent =
                now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0') + ' ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0') + ':' +
                String(now.getSeconds()).padStart(2,'0');
        }
        updateTime();
        setInterval(updateTime, 1000);

        function refreshData() {
            var btn = document.getElementById('refreshBtn');
            btn.style.pointerEvents = 'none';
            var icon = btn.querySelector('i');
            icon.style.animation = 'fa-spin 0.8s linear infinite';
            icon.classList.add('fa-spin');

            if (map) {
                resetView();
                map.resize();
            }

            setTimeout(function() {
                btn.style.pointerEvents = 'auto';
                icon.style.animation = '';
                icon.classList.remove('fa-spin');
            }, 1200);
        }
    </script>
</body>
</html>
