window.clearCacheNow = async function() {
    var results = []; var preserve = {};
    ['logged_in','ss_theme'].forEach(function(k) { var v = localStorage.getItem(k); if(v) preserve[k]=v; });
    var lsCount = localStorage.length; localStorage.clear();
    Object.keys(preserve).forEach(function(k) { localStorage.setItem(k, preserve[k]); });
    results.push('localStorage清除'+(lsCount-Object.keys(preserve).length)+'项');
    if ('caches' in window) {
        try { var ns = await caches.keys(); for(var i=0;i<ns.length;i++) await caches.delete(ns[i]); results.push('Cache清除'+ns.length+'个'); } catch(e){}
    }
    showToast('缓存清除完成！'+results.join(' | '),'warning',3000);
};

function createConfirmModal(title, content, onConfirm) {
    var old = document.getElementById('__globalModal'); if (old) old.remove();
    var overlay = document.createElement('div'); overlay.id = '__globalModal'; overlay.className = 'modal-overlay show';
    overlay.innerHTML = '<div class="modal" style="width:420px"><div class="modal-header"><span class="modal-title">'+title+'</span><div class="modal-close" onclick="document.getElementById(\'__globalModal\').remove()">×</div></div><div class="modal-body" style="padding:20px 24px;font-size:14px;line-height:1.7">'+content+'</div><div class="modal-footer"><button class="btn btn-default" onclick="document.getElementById(\'__globalModal\').remove()">取消</button><button class="btn btn-primary" id="__confirmBtn">确认</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('__confirmBtn').onclick = function() { document.getElementById('__globalModal').remove(); if (onConfirm) onConfirm(); };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

// 计算KPI
function calcKPIs(rpts){
    var today=new Date();var weekAgo=new Date(today);weekAgo.setDate(today.getDate()-today.getDay()-1);
    var weekReports=rpts.filter(function(r){return r.date>=weekAgo.toISOString().slice(0,10)&&r.status==='submitted'});
    var projects=new Set(rpts.map(function(r){return r.project}));
    // 项目总数
    var allProjects=['庄子产业园二期场平及基础设施配套建设项目','庄子产业园二期道路及管网工程','竹园镇地灾治理项目','庄子上园区污水处理厂扩建'];
    // 计算最新累计投资占比
    var latestByProject={};rpts.forEach(function(r){if(r.status==='submitted'){if(!latestByProject[r.project]||r.date>latestByProject[r.project].date)latestByProject[r.project]=r}});
    var totalInvest=0,totalComplete=0;
    for(var k in latestByProject){totalInvest+=latestByProject[k].invest_total;totalComplete+=latestByProject[k].h;}
    var rate=totalInvest>0?(totalComplete/totalInvest*100).toFixed(1):0;
    // 超时判断：今天已填的项目
    var todayReports=rpts.filter(function(r){return r.date===todayStr&&r.status==='submitted'}).map(function(r){return r.project});
    var overdue=allProjects.filter(function(p){return todayReports.indexOf(p)===-1});
    document.getElementById('kpi_reported').textContent=weekReports.length;
    document.getElementById('kpi_projects').textContent=projects.size;
    document.getElementById('kpi_rate').textContent=rate+'%';
    document.getElementById('kpi_overdue').textContent=overdue.length;

    // 告警列表
    var alist=document.getElementById('alertList');
    alist.innerHTML='';
    if(overdue.length===0){document.getElementById('alertEmpty').style.display='block';document.getElementById('alertCount').textContent='0条';}
    else{document.getElementById('alertEmpty').style.display='none';document.getElementById('alertCount').textContent=overdue.length+'条';
        // 找这个项目最近一次上报的日期
        overdue.forEach(function(p){
            var lastReport=rpts.filter(function(r){return r.project===p&&r.status==='submitted'}).sort(function(a,b){return b.date.localeCompare(a.date)})[0];
            var lastDate=lastReport?lastReport.date:'无记录';
            var daysDiff=lastReport?Math.floor((new Date(todayStr)-new Date(lastDate))/(86400000)):999;
            var badgeClass=daysDiff>3?'alert-badge':'alert-warn';
            alist.innerHTML+='<li><div><i class="fa fa-folder" style="color:var(--text-tertiary);margin-right:6px"></i><b>'+p+'</b><div class="stats-mini"><span>上次上报：'+lastDate+'</span><span>已逾期 <b>'+(daysDiff>3?daysDiff+'天':'今天')+'</b></span></div></div><span class="'+badgeClass+'">'+(daysDiff>3?'严重超时':'今日未报')+'</span></li>';
        });
    }
}

// 渲染图表
function renderCharts(rpts){
    var sorted=[].concat(rpts).filter(function(r){return r.status==='submitted'}).sort(function(a,b){return a.date.localeCompare(b.date)});

    // 折线图：近7日投资趋势
    var days=[];var now=new Date();
    for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var ds=d.toISOString().slice(0,10);days.push(ds.slice(5))}

    var dailyH={},dailyG={};
    days.forEach(function(d){var full='2026-'+d;dailyH[full]=null;dailyG[full]=null});
    // 取每天最新一条
    sorted.forEach(function(r){dailyH[r.date]=r.h;dailyG[r.date]=r.g});

    var c1=echarts.init(document.getElementById('chart-invest'));
    c1.setOption({animation:true,tooltip:{trigger:'axis'},legend:{bottom:0,textStyle:{color:'#a0cfff',fontSize:10},data:['累计投资(H)','新增投资(G)']},xAxis:{type:'category',data:days,axisLabel:{color:'#a0cfff',fontSize:11},axisLine:{lineStyle:{color:'#2b68e0'}}},yAxis:{type:'value',axisLabel:{color:'#a0cfff',fontSize:11},splitLine:{lineStyle:{color:'rgba(43,104,224,0.2)'}}},grid:{left:60,right:10,top:20,bottom:40},series:[
        {name:'累计投资(H)',type:'line',smooth:true,data:days.map(function(d){return dailyH['2026-'+d]}),lineStyle:{color:'#40c4ff',width:2},areaStyle:{color:'rgba(64,196,255,0.1)'},symbol:'circle',symbolSize:4,itemStyle:{color:'#40c4ff'}},
        {name:'新增投资(G)',type:'bar',data:days.map(function(d){return dailyG['2026-'+d]}),barWidth:16,itemStyle:{color:'rgba(76,217,100,0.6)',borderRadius:[4,4,0,0]}}
    ]});

    // 饼图：各项目工程量分布
    var projMap={};sorted.forEach(function(r){if(!projMap[r.project])projMap[r.project]=0;projMap[r.project]+=r.e});
    var pieData=[];var colors=['#40c4ff','#4cd964','#ff9500','#7b61ff'];
    for(var k in projMap)pieData.push({value:projMap[k],name:k});
    var c2=echarts.init(document.getElementById('chart-pie'));
    c2.setOption({animation:true,tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#a0cfff',fontSize:10}},series:[{type:'pie',radius:['40%','65%'],data:pieData,itemStyle:{color:function(p){return colors[p.dataIndex%colors.length]}},label:{color:'#a0cfff',fontSize:10},animationType:'scale'}]});

    window.addEventListener('resize',function(){c1.resize();c2.resize();});
}

// 渲染表格
function renderTable(rpts){
    var tbody=document.getElementById('reportTbody');
    var sorted=[].concat(rpts).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});
    tbody.innerHTML='';
    if(sorted.length===0){document.getElementById('emptyMsg').style.display='block';return;}
    document.getElementById('emptyMsg').style.display='none';
    sorted.forEach(function(r){
        var rate=r.invest_total>0?(r.h/r.invest_total*100).toFixed(1):0;
        tbody.innerHTML+='<tr data-search="'+r.project+r.person+r.date+'"><td>'+r.date+'</td><td>'+r.project+'</td><td>'+r.person+'</td><td>'+r.d.toFixed(2)+'</td><td>'+r.g.toFixed(2)+'</td><td style="color:#40c4ff;font-weight:600">'+r.h.toFixed(2)+'</td><td>'+(rate>80?'<span style="color:#4cd964">':'<span style="color:#ff9500">')+rate+'%</span></td><td>'+(r.status==='submitted'?'<span class="tag-submitted">已上报</span>':'<span class="tag-draft">草稿</span>')+'</td></tr>';
    });
}

function filterTable(){
    var kw=document.getElementById('searchInput').value.trim().toLowerCase();
    document.querySelectorAll('#reportTbody tr').forEach(function(tr){tr.style.display=kw?tr.textContent.toLowerCase().indexOf(kw)>-1?'':'none':''});
}

function showToast(msg,type,duration){
    duration = duration || 3000;
    var container=document.getElementById('toastContainer');var t=document.createElement('div');
    t.className='toast toast-'+(type||'success');
    t.innerHTML='<i class="fa fa-'+(type==='success'?'check-circle':'info-circle')+'"></i> '+msg;
    t.style.cssText='padding:10px 20px;border-radius:6px;margin-bottom:8px;background:linear-gradient(135deg,rgba(16,24,56,0.95),rgba(22,41,105,0.95));border:1px solid rgba(43,104,224,0.4);color:#a0cfff;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn 0.3s ease';
    container.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove()},300)},3000);
}

setInterval(function(){var n=new Date();var p=function(x){return String(x).padStart(2,'0')};var el=document.getElementById('pageTime');if(el)el.textContent=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())},1000);

window.addEventListener('DOMContentLoaded',function(){

// ===== 通用分页 =====
(function() {
    var PAGE_SIZE = 10;
    function initPaginations() {
        document.querySelectorAll('.card').forEach(function(card) {
            var table = card.querySelector('.data-table tbody');
            var pagination = card.querySelector('.pagination');
            if (!table || !pagination) return;
            var rows = Array.from(table.querySelectorAll('tr'));
            if (rows.length === 0) return;
            var infoSpan = pagination.querySelector('span:first-child');
            var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
            function renderPage(page) {
                var start = (page - 1) * PAGE_SIZE;
                var end = Math.min(start + PAGE_SIZE, rows.length);
                rows.forEach(function(row, i) { row.style.display = (i >= start && i < end) ? '' : 'none'; });
                infoSpan.textContent = '共 ' + rows.length + ' 条  第' + (start + 1) + '-' + end + '条';
                updateBtns(page, totalPages, pagination);
            }
