function showToast(msg,type,duration){

    t.style.cssText='padding:10px 20px;border-radius:6px;margin-bottom:8px;background:linear-gradient(135deg,rgba(16,24,56,0.95),rgba(22,41,105,0.95));border:1px solid rgba(43,104,224,0.4);color:#a0cfff;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn 0.3s ease';

}

var snCounter = 12;
function generateSN(){
    snCounter++;
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    var seq = String(snCounter).padStart(3,'0');
    return 'HQ'+y+m+dd+seq;
}

var filteredTodos = Array.from({length: todos.length}, function(_, i) { return i; });

function initFilters(){
    var sel=document.getElementById('fType');var seen={};
    todos.forEach(function(b){if(!seen[b.typeName]){seen[b.typeName]=1;var opt=document.createElement('option');opt.textContent=b.typeName;sel.appendChild(opt);}});
}

function statusTag(s){
    if(s==='待填写') return '<span class="tag-pending">待填写</span>';
    if(s==='进行中') return '<span class="tag-ongoing">进行中</span>';
    return '<span class="tag-done">已上报</span>';
}

function renderTable(){
    var tbody=document.getElementById('todoTbody');
    var frag=document.createDocumentFragment();
    filteredTodos.forEach(function(idx){
        var b=todos[idx];
        var tr=document.createElement('tr');

        var td0=document.createElement('td');
        td0.style.textAlign='center';
        var cb=document.createElement('input');
        cb.type='checkbox';cb.className='row-cb';cb.style.cursor='pointer';cb.setAttribute('data-idx',idx);
        td0.appendChild(cb);tr.appendChild(td0);

        var tdSn=document.createElement('td');tdSn.textContent=b.sn;tr.appendChild(tdSn);

        var tdItem=document.createElement('td');
        var sp=document.createElement('span');sp.className='detail-cell';sp.textContent=b.item;sp.title=b.item;tdItem.appendChild(sp);tr.appendChild(tdItem);

        var tdUnit=document.createElement('td');tdUnit.style.textAlign='center';tdUnit.textContent='佳兴铝业';tr.appendChild(tdUnit);

        var tdDl=document.createElement('td');tdDl.style.cssText='font-size:12px;white-space:nowrap';tdDl.textContent=b.deadline;tr.appendChild(tdDl);

        var tdDesc=document.createElement('td');
        var spDesc=document.createElement('span');spDesc.className='detail-cell';spDesc.textContent=b.desc||'--';spDesc.title=b.desc||'--';tdDesc.appendChild(spDesc);tr.appendChild(tdDesc);

        var tdSt=document.createElement('td');tdSt.style.textAlign='center';tdSt.innerHTML=statusTag(b.status);tr.appendChild(tdSt);

        var tdA=document.createElement('td');
        var btnDetail=document.createElement('button');btnDetail.className='btn btn-default';btnDetail.style.cssText='padding:3px 8px;font-size:11px';
        btnDetail.textContent='详情';btnDetail.setAttribute('data-idx',idx);
        btnDetail.dataset.deleteInited='1';
        btnDetail.setAttribute('onclick','_showDetail(event,'+idx+')');tdA.appendChild(btnDetail);

        if(b.status==='待填写'){
            tdA.appendChild(document.createTextNode(' '));
            var btnFill=document.createElement('button');btnFill.className='btn btn-primary';btnFill.style.cssText='padding:3px 8px;font-size:11px';            btnFill.textContent='立即填报';btnFill.setAttribute('data-idx',idx);
            btnFill.dataset.deleteInited='1';
            btnFill.setAttribute('onclick','_startFill(event,'+idx+')');tdA.appendChild(btnFill);
        }else if(b.status==='进行中'){
            tdA.appendChild(document.createTextNode(' '));
            var btnReport=document.createElement('button');btnReport.className='btn btn-warning';btnReport.style.cssText='padding:3px 8px;font-size:11px';btnReport.textContent='提交回执';btnReport.setAttribute('data-idx',idx);
            btnReport.dataset.deleteInited='1';
            btnReport.setAttribute('onclick','_submitReport(event,'+idx+')');tdA.appendChild(btnReport);
        }
        tr.appendChild(tdA);
        frag.appendChild(tr);
    });
    tbody.innerHTML='';
    tbody.appendChild(frag);
    if(typeof initPagination==='function') initPagination();
}

function _showDetail(e,i){e.stopPropagation();showDetail(i);return false;} function _startFill(e,i){e.stopPropagation();startFill(i);return false;} function _submitReport(e,i){e.stopPropagation();submitReport(i);return false;}

function showDetail(i){

    var body=document.getElementById('detailBody');
    if(!body){showToast('弹窗加载失败，请刷新页面','warning');return;}
    body.innerHTML=
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px">'+
        '<div><b style="color:var(--text-secondary)">单号：</b>'+b.sn+'</div>'+
        '<div><b style="color:var(--text-secondary)">接收单位：</b>佳兴铝业</div>'+
        '<div><b style="color:var(--text-secondary)">事项：</b>'+b.item+'</div>'+
        '<div><b style="color:var(--text-secondary)">事项类型：</b>'+b.typeName+'</div>'+
        '<div><b style="color:var(--text-secondary)">截止时间：</b>'+b.deadline+'</div>'+
        '<div><b style="color:var(--text-secondary)">状态：</b>'+statusTag(b.status)+'</div>'+
        '</div>'+
        '<div style="margin-top:14px"><b style="color:var(--text-secondary)">详情说明：</b></div>'+
        '<div style="margin-top:6px;padding:12px;background:rgba(123,97,255,0.06);border-radius:6px;line-height:1.7;font-size:13px;border-left:3px solid #7b61ff">'+b.desc+'</div>';
    document.getElementById('detailModal').classList.add('show');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('show');}

function startFill(i){
    var b=todos[i];
    var body=document.getElementById('confirmBody');
    body.innerHTML='<p>您即将对以下事项进行<b>立即填报</b>：</p>'+
        '<div style="margin:12px 0;padding:12px;background:rgba(123,97,255,0.06);border-radius:8px;border-left:3px solid #7b61ff;font-size:13px">'+
        '<div><b>单号：</b>'+b.sn+'</div><div><b>事项：</b>'+b.item+'</div><div><b>截止时间：</b>'+b.deadline+'</div></div>'+
        '<p style="color:var(--text-tertiary);font-size:12px">点击确认后将进入填报页面，请确保在规定时间内完成填写。</p>';
    document.getElementById('confirmTitle').innerHTML='<i class="fa fa-edit" style="color:#ff9500;margin-right:6px"></i>立即填报确认';
    var footer=document.getElementById('confirmFooter');
    footer.innerHTML='<button class="btn btn-default" onclick="closeConfirmModal()">取消</button><button class="btn btn-primary" id="__cfBtn">确认填报</button>';
    document.getElementById('__cfBtn').onclick=function(){
        todos[i].status='进行中';
        renderTable();
        closeConfirmModal();
        showToast('已进入「'+b.item+'」填报页面，请尽快完成填写','success');
    };
    document.getElementById('confirmModal').classList.add('show');
}

function submitReport(i){
    var b=todos[i];
    var body=document.getElementById('confirmBody');
    body.innerHTML='<p>您即将对以下事项<b>提交回执</b>：</p>'+
        '<div style="margin:12px 0;padding:12px;background:rgba(123,97,255,0.06);border-radius:8px;border-left:3px solid #7b61ff;font-size:13px">'+
        '<div><b>单号：</b>'+b.sn+'</div><div><b>事项：</b>'+b.item+'</div><div><b>截止时间：</b>'+b.deadline+'</div></div>'+
        '<p style="color:var(--text-tertiary);font-size:12px">提交后将上报至园区管委会，确认提交？</p>';
    document.getElementById('confirmTitle').innerHTML='<i class="fa fa-paper-plane" style="color:#7b61ff;margin-right:6px"></i>提交回执确认';
    var footer=document.getElementById('confirmFooter');
    footer.innerHTML='<button class="btn btn-default" onclick="closeConfirmModal()">取消</button><button class="btn btn-warning" id="__cfBtn">确认提交</button>';
    document.getElementById('__cfBtn').onclick=function(){
        todos[i].status='已上报';
        renderTable();
        closeConfirmModal();
        showToast('「'+b.item+'」回执已提交成功','success');
    };
    document.getElementById('confirmModal').classList.add('show');
}
function closeConfirmModal(){document.getElementById('confirmModal').classList.remove('show');}

function filterTable(){
    var fKeyword=(document.getElementById('fKeyword').value||'').trim().toLowerCase();
    var fType=document.getElementById('fType').value.replace(/[ ]/g,'').trim();
    var fStatus=document.getElementById('fStatus').value.replace(/[ ]/g,'').trim();
    var fDate=document.getElementById('fDate').value;
    filteredTodos = [];
    for(var i=0;i<todos.length;i++){
        var b=todos[i];
        var t=[b.sn,b.item,b.typeName,b.deadline,b.status,b.desc].join(' ').toLowerCase();
        if((!fKeyword||t.indexOf(fKeyword)>-1)&&(!fType||t.indexOf(fType)>-1)&&(!fStatus||t.indexOf(fStatus)>-1)&&(!fDate||t.indexOf(fDate)>-1)){
            filteredTodos.push(i);
        }
    }
    renderTable();
}

function resetFilters(){
    ['fKeyword','fType','fStatus','fDate'].forEach(function(id){document.getElementById(id).value='';});
    filteredTodos = Array.from({length: todos.length}, function(_, i) { return i; });
    renderTable();
    showToast('筛选条件已重置','info');
}

document.addEventListener('DOMContentLoaded',function(){
    initFilters();
    document.querySelectorAll('.filter-row select option').forEach(function(opt){
        var t=opt.textContent.trim();if(t) opt.textContent='　　'+t+'　　';
    });
    var searchBtn=document.querySelector('.btn-search');
    if(searchBtn) searchBtn.addEventListener('click',filterTable);
    renderTable();
});

// ========== 分页 ==========
var initPagination=(function(){
    var PAGE_SIZE=10;
    return function initPagination(){
        document.querySelectorAll('.card').forEach(function(card){
            var table=card.querySelector('.data-table tbody');
            var pagination=card.querySelector('.pagination');
            if(!table||!pagination)return;
            var rows=Array.from(table.querySelectorAll('tr'));
            if(rows.length===0)return;
            var infoSpan=pagination.querySelector('span:first-child');
            var totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
            function renderPage(page){
                var start=(page-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,rows.length);
                rows.forEach(function(r,i){r.style.display=(i>=start&&i<end)?'':'none';});
                infoSpan.textContent='共 '+rows.length+' 条  第'+(start+1)+'-'+end+'条';
                updateBtns(page,totalPages,pagination);
            }
            function updateBtns(page,total,pagi){
                var bd=pagi.querySelector('.page-btns');if(!bd)return;bd.innerHTML='';
                var prev=document.createElement('div');prev.className='page-btn'+(page<=1?' disabled':'');prev.textContent='\u00AB';prev.style.cssText='cursor:'+(page<=1?'default':'pointer')+';opacity:'+(page<=1?'0.4':'1');
                if(page>1)prev.onclick=function(){renderPage(page-1);};bd.appendChild(prev);
                var sp=Math.max(1,page-2),ep=Math.min(total,sp+4);if(ep-sp<4)sp=Math.max(1,ep-4);
                for(var p=sp;p<=ep;p++){(function(pp){var btn=document.createElement('div');btn.className='page-btn'+(pp===page?' active':'');btn.textContent=pp;btn.onclick=function(){renderPage(pp);};bd.appendChild(btn);})(p);}
                var next=document.createElement('div');next.className='page-btn'+(page>=total?' disabled':'');next.textContent='\u00BB';next.style.cssText='cursor:'+(page>=total?'default':'pointer')+';opacity:'+(page>=total?'0.4':'1');
                if(page<total)next.onclick=function(){renderPage(page+1);};bd.appendChild(next);
            }
            renderPage(1);
        });
    };
})();

// ========== 导出功能 ==========
var exportFormat='excel';
function openExportModal(){document.getElementById('exportModal').classList.add('show');}
function closeExportModal(){document.getElementById('exportModal').classList.remove('show');}
function selectExportFormat(el,fmt){
    exportFormat=fmt;
    document.querySelectorAll('.export-option').forEach(function(o){o.classList.remove('selected');});
    el.classList.add('selected');
}
function doExport(){
    var data=todos.map(function(b){return{
        '单号':b.sn,'事项':b.item,'接收单位':'佳兴铝业','截止时间':b.deadline,'状态':b.status,'详情说明':b.desc
    };});
    var el=document.getElementById('exportModal');
    el.querySelector('.modal-footer button:last-child').textContent='导出中...';
    el.querySelector('.modal-footer button:last-child').disabled=true;
    _loadLibs(function(){
        _execExport(data);
        el.querySelector('.modal-footer button:last-child').textContent='导出';
        el.querySelector('.modal-footer button:last-child').disabled=false;
    });
}

function _loadLibs(cb){
    var loaded=0,total=2;
    function check(){loaded++;if(loaded>=total)cb();}
    if(typeof XLSX!=='undefined'){check();}else{var s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';s.onload=check;document.head.appendChild(s);}
    if(typeof jspdf!=='undefined'){check();}else{var s2=document.createElement('script');s2.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s2.onload=check;document.head.appendChild(s2);}
}

function _execExport(data){
    try{
        if(exportFormat==='excel'){
            var ws=XLSX.utils.json_to_sheet(data);
            var wb=XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb,ws,'待办事项');
            XLSX.writeFile(wb,'园企交互待办_'+new Date().toISOString().slice(0,10)+'.xlsx');
        }else if(exportFormat==='pdf'){
            var w=window.open('','_blank');
            w.document.write('<html><head><meta charset="utf-8"><title>园企交互待办</title>');
            w.document.write('<style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:6px}th{background:#7b61ff;color:#fff;position:sticky;top:0}</style>');
            w.document.write('</head><body>');
            w.document.write('<h2>待办事项列表</h2>');
            w.document.write('<table><thead><tr><th>单号</th><th>事项</th><th>接收单位</th><th>截止时间</th><th>详情说明</th><th>状态</th></tr></thead><tbody>');
            data.forEach(function(r){w.document.write('<tr><td>'+r['单号']+'</td><td>'+r['事项']+'</td><td>佳兴铝业</td><td>'+r['截止时间']+'</td><td style="max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+r['详情说明']+'</td><td>'+r['状态']+'</td></tr>');});
            w.document.write('</tbody></table></body></html>');
            w.document.close();
            setTimeout(function(){w.print();setTimeout(function(){w.close();},500);},300);
        }else if(exportFormat==='word'){
            var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>园企交互待办</title></head><body>';
            html+='<h2>待办事项列表</h2><table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:12px;width:100%">';
            html+='<tr style="background:#7b61ff;color:#fff"><th>单号</th><th>事项</th><th>接收单位</th><th>截止时间</th><th>详情说明</th><th>状态</th></tr>';
            data.forEach(function(r){html+='<tr><td>'+r['单号']+'</td><td>'+r['事项']+'</td><td>佳兴铝业</td><td>'+r['截止时间']+'</td><td>'+r['详情说明']+'</td><td>'+r['状态']+'</td></tr>';});
            html+='</table></body></html>';
            var blob=new Blob(['\uFEFF'+html],{type:'application/msword'});
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a');a.href=url;a.download='园企交互待办_'+new Date().toISOString().slice(0,10)+'.doc';
            document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
        }
        showToast('导出成功！格式：'+exportFormat,'success');
    }catch(e){showToast('导出失败：'+e.message,'warning');}
    closeExportModal();
}
</script>
