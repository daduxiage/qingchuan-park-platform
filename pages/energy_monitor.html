    <style>
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.overview-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;text-align:center}
.overview-card .oc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 10px}
.overview-card .oc-value{font-size:28px;font-weight:700;margin-bottom:4px}
.overview-card .oc-label{font-size:12px;color:var(--text-tertiary)}
.overview-card .oc-sub{font-size:11px;margin-top:8px;padding:4px 12px;border-radius:20px;display:inline-block}
.oc-up{background:rgba(76,217,100,0.1);color:#4cd964}.oc-down{background:rgba(255,77,79,0.1);color:#ff4d4f}
.tag-up{background:rgba(76,217,100,0.12);color:#4cd964;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.tag-down{background:rgba(255,77,79,0.12);color:#ff4d4f;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.tag-flat{background:rgba(158,158,158,0.12);color:#9e9e9e;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.filter-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.filter-row .form-control{min-width:120px;width:auto;flex:0 0 auto}
.data-table td{white-space:nowrap}
.export-options{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.export-option{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--split-color);border-radius:8px;cursor:pointer;transition:all .2s;background:transparent}
.export-option:hover{border-color:#40c4ff;background:rgba(64,196,255,0.06)}
.export-option.selected{border-color:#40c4ff;background:rgba(64,196,255,0.1)}
.export-option-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.export-option-icon.excel{background:rgba(76,175,80,0.15);color:#4caf50}
.export-option-icon.pdf{background:rgba(244,67,54,0.15);color:#f44336}

.export-option-body{flex:1}
.export-option-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.export-option-desc{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.export-option-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--split-color);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.export-option.selected .export-option-check{border-color:#40c4ff;background:#40c4ff}
.export-option.selected .export-option-check::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
@media(max-width:900px){.overview-grid{grid-template-columns:repeat(2,1fr)}}
</style>

    <div class="overview-card"><div class="oc-icon" style="background:rgba(255,149,0,0.12);color:#ff9500"><i class="fa fa-fire"></i></div><div class="oc-value" style="color:#ff9500" id="ocGas">0</div><div class="oc-label">本月用气 (m³)</div><div class="oc-sub oc-up" id="ocGasTrend">--</div></div>

<div class="modal-overlay" id="fillModal"><div class="modal" style="width:500px"><div class="modal-header"><span class="modal-title"><i class="fa fa-pen-to-square" style="color:#40c4ff;margin-right:6px"></i>用能数据填报</span><div class="modal-close" onclick="closeFillModal()">×</div></div><div class="modal-body" style="padding:20px 24px">
    <div style="display:grid;gap:14px">
        <div class="form-group"><label style="font-size:12px;color:var(--text-tertiary);display:block;margin-bottom:5px">企业名称</label><select class="form-control" id="fillCompany" style="width:100%"></select></div>
        <div class="form-group"><label style="font-size:12px;color:var(--text-tertiary);display:block;margin-bottom:5px">归属月份</label><input class="form-control" id="fillMonth" type="month" style="width:100%"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="form-group"><label style="font-size:12px;color:var(--text-tertiary);display:block;margin-bottom:5px">用电(万kWh)</label><input class="form-control" id="fillPower" type="number" step="0.1" placeholder="0.0" style="width:100%"></div>
            <div class="form-group"><label style="font-size:12px;color:var(--text-tertiary);display:block;margin-bottom:5px">用水(吨)</label><input class="form-control" id="fillWater" type="number" step="0.1" placeholder="0.0" style="width:100%"></div>
        </div>

            <div class="form-group"><label style="font-size:12px;color:var(--text-tertiary);display:block;margin-bottom:5px">能耗成本(万)</label><input class="form-control" id="fillCost" type="number" step="0.01" placeholder="0.00" style="width:100%"></div>

<div class="modal-overlay" id="exportModal"><div class="modal" style="width:440px"><div class="modal-header"><span class="modal-title"><i class="fa fa-download" style="color:#40c4ff;margin-right:6px"></i>导出数据</span><div class="modal-close" onclick="closeExportModal()">×</div></div><div class="modal-body"><div class="export-options"><div class="export-option selected" onclick="selectExport(this,'excel')"><div class="export-option-icon excel"><i class="fa fa-file-excel"></i></div><div class="export-option-body"><div class="export-option-title">Excel</div><div class="export-option-desc">.xlsx</div></div><div class="export-option-check"></div></div><div class="export-option" onclick="selectExport(this,'pdf')"><div class="export-option-icon pdf"><i class="fa fa-file-pdf"></i></div><div class="export-option-body"><div class="export-option-title">PDF</div><div class="export-option-desc">.pdf</div></div><div class="export-option-check"></div></div><div class="export-option" onclick="selectExport(this,'word')"><div class="export-option-icon word"><i class="fa fa-file-word"></i></div><div class="export-option-body"><div class="export-option-title">Word</div><div class="export-option-desc">.doc</div></div><div class="export-option-check"></div></div></div></div><div class="modal-footer"><button class="btn btn-default" onclick="closeExportModal()">取消</button><button class="btn btn-primary" onclick="doExport()"><i class="fa fa-download"></i> 导出</button></div></div></div>

<script src="/pages/common.js"></script>
<script>
(function(){document.querySelector('#loadingMask').classList.add('hide');setTimeout(function(){document.querySelector('#loadingMask').style.display='none'},500);})();

var energies=[], filtered=[], PAGE_SIZE=15, exportFormat='excel';
function genSN(){return 'EN'+new Date().getFullYear()+String(Math.floor(Math.random()*9000+1000));}
var COMPANIES=['佳兴铝业','阜成新材','虹禾晶科技','中能建','星恒青源','九晟新材','华纳实业','新通鑫','广袤新材'];

function seedData(){
    if(energies.length)return;
    var now=new Date();var y=now.getFullYear(),m=now.getMonth()+1;
    COMPANIES.forEach(function(c,i){
        for(var mm=Math.max(1,m-3);mm<=m;mm++){
            var power=(Math.random()*80+20).toFixed(1);
            var water=Math.floor(Math.random()*5000+1000);
            var gas=Math.floor(Math.random()*30000+5000);
            var cost=(parseFloat(power)*0.8+water*0.005+gas*0.003).toFixed(2);
            var prevPow=(Math.random()*80+20).toFixed(1);
            var prevCost=(parseFloat(prevPow)*0.8+water*0.005+gas*0.003).toFixed(2);
            var yoy=((cost-prevCost)/prevCost*100).toFixed(1);
            var prevMonth=mm===1?12:mm-1;
            var prevM=mm===1?y-1:y;
            var prevEntry=energies.find(function(e){return e.company===c&&e.month===prevM+'-'+String(prevMonth).padStart(2,'0');});
            var mom='--';
            if(prevEntry){
                var lastCost=prevEntry.cost;
                mom=((cost-lastCost)/lastCost*100).toFixed(1);
            }else if(mm>Math.max(1,m-3)){
                mom=((Math.random()*20)-10).toFixed(1);
            }
            energies.push({
                sn:'EN'+y+String(mm).padStart(2,'0')+String(i+1).padStart(2,'0'),
                company:c, month:y+'-'+String(mm).padStart(2,'0'),
                power:parseFloat(power),water:water,gas:gas,cost:parseFloat(cost),
                yoy:parseFloat(yoy),mom:mom==='--'?'--':parseFloat(mom),id:energies.length
            });
        }
    });
    updateKPIs();renderOverview();filtered=energies.map(function(_,i){return i;});
}

function tagVal(v,isYoY){
    if(v==='--')return '<span class="tag-flat">--</span>';
    v=parseFloat(v);
    return v>0?'<span class="tag-up">'+isYoY?'▲':'↑'+v+'%</span>':'<span class="tag-down">'+isYoY?'▼':'↓'+Math.abs(v).toFixed(1)+'%</span>';
}
function yoyTag(v){if(v==='--')return '<span class="tag-flat">--</span>';v=parseFloat(v);return v>0?'<span class="tag-up">▲'+v.toFixed(1)+'%</span>':v<0?'<span class="tag-down">▼'+Math.abs(v).toFixed(1)+'%</span>':'<span class="tag-flat">— 0%</span>';}
function momTag(v){if(v==='--')return '<span class="tag-flat">--</span>';v=parseFloat(v);return v>0?'<span class="tag-up">↑'+v.toFixed(1)+'%</span>':v<0?'<span class="tag-down">↓'+Math.abs(v).toFixed(1)+'%</span>':'<span class="tag-flat">→ 0%</span>';}

function updateKPIs(){
    var uniq={},now=new Date(),cm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    energies.forEach(function(e){uniq[e.company]=1;});
    document.getElementById('kpiCompanies').textContent=Object.keys(uniq).length;
    var thisMonth=energies.filter(function(e){return e.month===cm;});
    var totalCost=thisMonth.reduce(function(a,e){return a+e.cost;},0);
    document.getElementById('kpiTotal').textContent=totalCost.toFixed(1);
    document.getElementById('kpiUp').textContent=thisMonth.filter(function(e){return e.yoy>0;}).length;
    document.getElementById('kpiReported').textContent=thisMonth.length;
}

function renderOverview(){
    var now=new Date(),cm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var thisMonth=energies.filter(function(e){return e.month===cm;});
    var tp=thisMonth.reduce(function(a,e){return a+e.power;},0);
    var tw=thisMonth.reduce(function(a,e){return a+e.water;},0);
    var tg=thisMonth.reduce(function(a,e){return a+e.gas;},0);
    var tc=thisMonth.reduce(function(a,e){return a+e.cost;},0);
    var lm=now.getMonth()===0?(now.getFullYear()-1)+'-12':now.getFullYear()+'-'+String(now.getMonth()).padStart(2,'0');
    var lastMonth=energies.filter(function(e){return e.month===lm;});
    var lc=lastMonth.reduce(function(a,e){return a+e.cost;},0);
    var trend=lc>0?((tc-lc)/lc*100).toFixed(1):0;
    document.getElementById('ocPower').textContent=tp.toFixed(1);
    document.getElementById('ocWater').textContent=tw.toLocaleString();
    document.getElementById('ocGas').textContent=tg.toLocaleString();
    document.getElementById('ocChart').textContent='¥'+tc.toFixed(1)+'万';
    document.getElementById('ocPowerTrend').innerHTML='用电'+trend+'%';
    document.getElementById('ocPowerTrend').className='oc-sub '+(trend>=0?'oc-up':'oc-down');
    document.getElementById('ocWaterTrend').innerHTML='同比'+trend+'%';
    document.getElementById('ocWaterTrend').className='oc-sub '+(trend>=0?'oc-up':'oc-down');
    document.getElementById('ocGasTrend').innerHTML='环比'+trend+'%';
    document.getElementById('ocGasTrend').className='oc-sub '+(trend>=0?'oc-up':'oc-down');

    // Sparkline
    if(typeof echarts!=='undefined'){
        var spark=echarts.init(document.getElementById('sparkChart'));
        var vals=[];for(var i=0;i<12;i++)vals.push(Math.floor(Math.random()*200+200));
        spark.setOption({grid:{left:0,right:0,top:0,bottom:0},xAxis:{show:false,data:vals},yAxis:{show:false,min:0},series:[{type:'bar',data:vals,itemStyle:{color:'#40c4ff',borderRadius:[3,3,0,0]}}]});
    }
}

function renderTable(){
    var tbody=document.getElementById('enTbody'),frag=document.createDocumentFragment();
    filtered.forEach(function(idx){
        var b=energies[idx],tr=document.createElement('tr');
        tr.innerHTML='<td>'+b.sn+'</td><td><b>'+b.month+'</b></td><td>'+b.company+'</td><td>'+b.power.toFixed(1)+'</td><td>'+b.water+'</td><td>'+b.gas+'</td><td><b>'+b.cost.toFixed(2)+'</b></td><td>'+yoyTag(b.yoy)+'</td><td>'+momTag(b.mom)+'</td><td></td>';
        var tdA=tr.lastChild;
        addBtn(tdA,'详情',idx,function(i){showDetail(i);});
        addBtn(tdA,'编辑',idx,function(i){openFillModal(i);});
        addBtn(tdA,'删除',idx,function(i){if(confirm('确定删除记录？')){energies.splice(i,1);filtered=energies.map(function(_,i2){return i2;});updateKPIs();renderOverview();renderTable();showToast('已删除','success');}},true);
        frag.appendChild(tr);
    });
    tbody.innerHTML='';tbody.appendChild(frag);
    if(typeof initPagination==='function')initPagination();
}
function addBtn(parent,text,idx,fn,isDanger){
    if(parent.children.length)parent.appendChild(document.createTextNode(' '));
    var btn=document.createElement('button');btn.className='btn btn-'+(isDanger?'danger':'default');btn.style.cssText='padding:3px 8px;font-size:11px';
    btn.textContent=text;btn.dataset.deleteInited='1';btn.setAttribute('onclick','('+fn.toString()+')('+idx+')');parent.appendChild(btn);
}

function showDetail(i){
    var b=energies[i];if(!b){showToast('数据加载失败','warning');return;}
    var body=document.getElementById('detailBody');
    body.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px">'+
        '<div><b style="color:var(--text-secondary)">单号：</b>'+b.sn+'</div>'+
        '<div><b style="color:var(--text-secondary)">归属月份：</b>'+b.month+'</div>'+
        '<div><b style="color:var(--text-secondary)">用电：</b><b>'+b.power.toFixed(1)+'</b> 万kWh</div>'+
        '<div><b style="color:var(--text-secondary)">用水：</b><b>'+b.water+'</b> 吨</div>'+
        '<div><b style="color:var(--text-secondary)">用气：</b><b>'+b.gas+'</b> m³</div>'+
        '<div><b style="color:var(--text-secondary)">能耗成本：</b><b>'+b.cost.toFixed(2)+'</b> 万元</div>'+
        '<div><b style="color:var(--text-secondary)">同比：</b>'+yoyTag(b.yoy)+'</div>'+
        '<div><b style="color:var(--text-secondary)">环比：</b>'+momTag(b.mom)+'</div>'+
        '</div>'+
        '<div style="margin-top:14px;padding:12px;background:rgba(123,97,255,0.06);border-radius:6px;line-height:1.7;font-size:13px;border-left:3px solid #7b61ff">企业 '+b.company+' 在 '+b.month+' 期间综合能耗成本 <b>'+b.cost.toFixed(2)+'</b> 万元</div>';
    document.getElementById('detailModal').classList.add('show');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('show');}

function openFillModal(idx){
    var sel=document.getElementById('fillCompany');
    sel.innerHTML=COMPANIES.map(function(c){return '<option>'+c+'</option>';}).join('');
    if(typeof idx==='number'&&energies[idx]){
        var b=energies[idx];
        sel.value=b.company;
        document.getElementById('fillMonth').value=b.month;
        document.getElementById('fillPower').value=b.power;
        document.getElementById('fillWater').value=b.water;
        document.getElementById('fillGas').value=b.gas;
        document.getElementById('fillCost').value=b.cost;
        document.getElementById('fillSubmitBtn').onclick=function(){
            b.power=parseFloat(document.getElementById('fillPower').value)||0;
            b.water=parseInt(document.getElementById('fillWater').value)||0;
            b.gas=parseInt(document.getElementById('fillGas').value)||0;
            b.cost=parseFloat(document.getElementById('fillCost').value)||0;
            closeFillModal();updateKPIs();renderOverview();renderTable();showToast('编辑成功','success');
        };
    } else {
        document.getElementById('fillMonth').value=new Date().toISOString().slice(0,7);
        ['fillPower','fillWater','fillGas','fillCost'].forEach(function(id){document.getElementById(id).value='';});
        document.getElementById('fillSubmitBtn').onclick=function(){
            var c=sel.value,fm=document.getElementById('fillMonth').value;
            if(!fm){showToast('请选择月份','warning');return;}
            energies.push({
                sn:genSN(),company:c,month:fm,
                power:parseFloat(document.getElementById('fillPower').value)||0,
                water:parseInt(document.getElementById('fillWater').value)||0,
                gas:parseInt(document.getElementById('fillGas').value)||0,
                cost:parseFloat(document.getElementById('fillCost').value)||0,
                yoy:0,mom:'--',id:energies.length
            });
            closeFillModal();filtered=energies.map(function(_,i){return i;});updateKPIs();renderOverview();renderTable();showToast('填报成功','success');
        };
    }
    document.getElementById('fillModal').classList.add('show');
}
function closeFillModal(){document.getElementById('fillModal').classList.remove('show');}

function filterTable(){
    var kw=(document.getElementById('fKeyword').value||'').trim().toLowerCase();
    var fm=document.getElementById('fMonth').value;
    filtered=[];energies.forEach(function(e,i){var t=(e.sn+' '+e.month+' '+e.company+' '+e.cost).toLowerCase();if((!kw||t.indexOf(kw)>-1)&&(!fm||e.month===fm))filtered.push(i);});
    renderTable();
}
function resetFilters(){document.getElementById('fKeyword').value='';document.getElementById('fMonth').value='';filtered=energies.map(function(_,i){return i;});renderTable();showToast('筛选已重置','info');}

var initPagination=(function(){return function(){
    document.querySelectorAll('.card').forEach(function(card){
        var table=card.querySelector('.data-table tbody'),pagi=card.querySelector('.pagination');if(!table||!pagi)return;
        var rows=Array.from(table.querySelectorAll('tr'));if(!rows.length)return;
        var info=pagi.querySelector('span:first-child'),tp=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
        function rp(p){var s=(p-1)*PAGE_SIZE,e=Math.min(s+PAGE_SIZE,rows.length);rows.forEach(function(r,i){r.style.display=(i>=s&&i<e)?'':'none';});info.textContent='共 '+rows.length+' 条  第'+(s+1)+'-'+e+'条';ub(p,tp,pagi);}
        function ub(p,t,pgi){var bd=pgi.querySelector('.page-btns');if(!bd)return;bd.innerHTML='';var prev=document.createElement('div');prev.className='page-btn'+(p<=1?' disabled':'');prev.textContent='\u00AB';if(p>1)prev.onclick=function(){rp(p-1);};bd.appendChild(prev);var sp=Math.max(1,p-2),ep=Math.min(t,sp+4);if(ep-sp<4)sp=Math.max(1,ep-4);for(var pp=sp;pp<=ep;pp++){(function(pp){var btn=document.createElement('div');btn.className='page-btn'+(pp===p?' active':'');btn.textContent=pp;btn.onclick=function(){rp(pp);};bd.appendChild(btn);})(pp);}var next=document.createElement('div');next.className='page-btn'+(p>=t?' disabled':'');next.textContent='\u00BB';if(p<t)next.onclick=function(){rp(p+1);};bd.appendChild(next);}
        rp(1);
    });
};})();

function openExportModal(){document.getElementById('exportModal').classList.add('show');}
function closeExportModal(){document.getElementById('exportModal').classList.remove('show');}
function selectExport(el,fmt){exportFormat=fmt;document.querySelectorAll('.export-option').forEach(function(o){o.classList.remove('selected');});el.classList.add('selected');}
function doExport(){
    var data=energies.map(function(b){return{单号:b.sn,归属月份:b.month,企业:b.company,用电:b.power,用水:b.water,用气:b.gas,成本:b.cost,同比:b.yoy,环比:b.mom};});
    var fn='用能监测_'+new Date().toISOString().slice(0,10);
    try{
        if(exportFormat==='excel'){var ws=XLSX.utils.json_to_sheet(data);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'用能');XLSX.writeFile(wb,fn+'.xlsx');}
        else if(exportFormat==='pdf'){var w=window.open('','_blank');w.document.write('<html><head><meta charset="utf-8"><title>用能</title><style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px;font-size:11px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:5px}th{background:#40c4ff;color:#fff}</style></head><body><h2>用能数据</h2><table><thead><tr><th>单号</th><th>月份</th><th>企业</th><th>成本</th></tr></thead><tbody>');data.forEach(function(r){w.document.write('<tr><td>'+r['单号']+'</td><td>'+r['归属月份']+'</td><td>'+r['企业']+'</td><td>'+r['成本']+'</td></tr>');});w.document.write('</tbody></table></body></html>');w.document.close();setTimeout(function(){w.print();setTimeout(function(){w.close();},500);},300);}
        else if(exportFormat==='word'){var html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body><h2>用能数据</h2><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-size:11px;width:100%"><tr style="background:#40c4ff;color:#fff"><th>单号</th><th>月份</th><th>企业</th><th>成本</th></tr>';data.forEach(function(r){html+='<tr><td>'+r['单号']+'</td><td>'+r['归属月份']+'</td><td>'+r['企业']+'</td><td>'+r['成本']+'</td></tr>';});html+='</table></body></html>';var blob=new Blob(['\uFEFF'+html],{type:'application/msword'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn+'.doc';document.body.appendChild(a);a.click();a.remove();}
        showToast('导出成功','success');
    }catch(e){showToast('导出失败:'+e.message,'warning');}
    closeExportModal();
}

window.addEventListener('DOMContentLoaded',function(){
    seedData();document.querySelector('.btn-search').addEventListener('click',filterTable);renderTable();
});
</script>
