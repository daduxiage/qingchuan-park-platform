name: 自动部署到轻量云

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 通过 SSH 拉取代码并重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/park-platform
            echo ">>> git pull..."
            git pull origin main
            echo ">>> 重启服务..."
            pm2 restart park-platform || pm2 start server.js --name park-platform
            pm2 save
            echo "✅ 部署完成 $(date '+%Y-%m-%d %H:%M:%S')"
            git log --oneline -1
